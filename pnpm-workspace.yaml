packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/integrations/*'
  - 'tools/*'
catalog:
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  '@hookform/resolvers': ^5.2.2
  '@mantine/core': ^9.2.0
  '@mantine/dates': ^9.2.0
  '@mantine/hooks': ^9.2.0
  '@mantine/notifications': ^9.2.0
  '@tabler/icons-react': ^3.21.0
  '@tanstack/react-query': ^5.100.10
  '@testing-library/react': ^16.3.2
  '@types/node': ^24.10.0
  '@types/node-forge': ^1.3.14
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  esbuild: ^0.25.0
  eslint: ^9.39.4
  eslint-config-next: ^16.2.6
  eslint-config-prettier: ^10.1.5
  fflate: ^0.8.2
  firebase: ^12.13.0
  firebase-admin: ^14.0.0
  firebase-functions: ^7.3.0
  google-auth-library: ^10.6.2
  jsdom: ^29.1.1
  next: 16.2.6
  node-forge: ^1.4.0
  react: ^19.2.0
  react-dom: ^19.2.0
  react-hook-form: ^7.75.0
  tsx: ^4.21.0
  typescript: ^6.0.3
  typescript-eslint: ^8.59.3
  vitest: ^4.1.6
  xmllint-wasm: ^5.2.0
  zod: ^4.4.3
catalogMode: strict
cleanupUnusedCatalogs: true
allowBuilds:
  '@firebase/util': true
  # Pure TypeScript SDK — ws, p-retry, protobufjs and google-auth-library, none
  # of them native. Nothing to compile, so its install script stays blocked.
  '@google/genai': false
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
