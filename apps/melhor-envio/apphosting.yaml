# Firebase App Hosting backend config for apps/melhor-envio.
# API-only service for the Melhor Envio freight integration: OAuth connect,
# quote, buy/print/track labels, and the ME status webhook.
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 20
  minInstances: 0
  concurrency: 80
# Env (set per-environment in the Firebase console → App Hosting → Environment
# variables, or via Cloud Secret Manager for secrets; required unless marked
# OPTIONAL):
#   FIREBASE_PROJECT_ID         OPTIONAL — auto-detected on App Hosting/Cloud Run
#                               (via FIREBASE_CONFIG.projectId; Cloud Run sets no project env var); set only to
#                               override, or in local dev without a service account
#   FIREBASE_DATABASE_ID        Firestore database id (default: "default")
#   MELHOR_ENVIO_CLIENT_ID      ME application id            (Secret Manager)
#   MELHOR_ENVIO_CLIENT_SECRET  ME application secret        (Secret Manager)
#   MELHOR_ENVIO_STATE_SECRET   HMAC key for the OAuth state (Secret Manager)
#   MELHOR_ENVIO_SANDBOX        required literal "true" or "false"; no Functions default
#   MELHOR_ENVIO_USER_AGENT     app name + contact email (ME requires it)
#   MELHOR_ENVIO_PUBLIC_URL     this backend's public origin — also required by
#                               notification Functions for OAuth token refresh; builds the
#                               OAuth redirect_uri (must match the URI registered
#                               in the Melhor Envio dashboard)
#   MELHOR_ENVIO_TASKS_DISABLED OPTIONAL — "1" persists notifications for the
#                               sweep instead of enqueueing
#   MELHOR_ENVIO_TASKS_REGION   notification function/queue region; falls back
#                               to FUNCTIONS_REGION, with no implicit default
#   WEB_APP_URL                 apps/web origin (the callback redirects back here)
#   ALLOWED_ADMIN_ORIGINS       CSV of apps/web origins for CORS (no localhost in prod)
