# Firebase App Hosting backend config for apps/integrations.
# Webhook endpoints respond fast and dispatch heavy work to Cloud Functions.
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 20
  minInstances: 0
  concurrency: 80
# FIREBASE_PROJECT_ID is OPTIONAL — auto-detected on App Hosting/Cloud Run
# (GOOGLE_CLOUD_PROJECT / FIREBASE_CONFIG); set it only to override, or via
# .env.local for local dev without a service account.
# Webhook signing secrets and Admin SDK service account live in Cloud Secret Manager.
