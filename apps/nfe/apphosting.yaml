# Firebase App Hosting backend config for apps/nfe.
# Authoritative NF-e (Nota Fiscal Eletrônica) API: generates, signs,
# persists with anti-loss ordering, and talks to SEFAZ.
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  minInstances: 0
  concurrency: 40
env:
  # Log/readability hygiene only — fiscal dates (dhEmi, chave AAMM, dhEvento,
  # inutilização ano) are computed with explicit per-UF offsets and do NOT
  # depend on the process TZ (see packages/integrations/nfe/src/generator/tz.ts, #395).
  - variable: TZ
    value: America/Sao_Paulo
    availability:
      - RUNTIME
# Env (set per-environment in the Firebase console → App Hosting → Environment
# variables, or via Cloud Secret Manager for secrets; required unless marked
# OPTIONAL):
#   FIREBASE_PROJECT_ID         OPTIONAL — auto-detected on App Hosting/Cloud Run
#                               (via FIREBASE_CONFIG.projectId; Cloud Run sets no project env var); set only to
#                               override, or in local dev without a service account
#   FIREBASE_DATABASE_ID        Firestore database id (default: "default")
#   NFE_AMBIENTE                "homologacao" (default) or "producao"
#   NFE_UF                      issuer UF (default: "SP")
#   NFE_CERT_BASE64             A1 PFX base-64 (Secret Manager)
#   NFE_CERT_PASSWORD           A1 PFX passphrase (Secret Manager)
#   ALLOWED_ADMIN_ORIGINS       CSV of apps/web origins for CORS (no localhost in prod)
#
# Producao only: requires NFE_ALLOW_PRODUCAO=true to clear BOTH safety guards
# (packages/integrations/nfe/src/safety) — assertSafeTpAmb at the generator entry,
# and assertSafeTpAmbForTransport immediately before every SEFAZ POST. Only the
# first honours NODE_ENV=test; the transport one takes NFE_ALLOW_PRODUCAO and
# nothing else, because the live CI suites are themselves Vitest.
