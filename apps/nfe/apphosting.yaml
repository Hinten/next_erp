# Firebase App Hosting backend config for apps/nfe.
# Authoritative NF-e (Nota Fiscal Eletrônica) API: generates, signs,
# persists with anti-loss ordering, and talks to SEFAZ.
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  minInstances: 0
  concurrency: 40
# Required env (set per-environment in the Firebase console → App Hosting →
# Environment variables, or via Cloud Secret Manager for secrets):
#   FIREBASE_PROJECT_ID         the GCP / Firebase project id
#   FIREBASE_DATABASE_ID        Firestore database id (default: "default")
#   NFE_AMBIENTE                "homologacao" (default) or "producao"
#   NFE_UF                      issuer UF (default: "SP")
#   NFE_CERT_BASE64             A1 PFX base-64 (Secret Manager)
#   NFE_CERT_PASSWORD           A1 PFX passphrase (Secret Manager)
#   ALLOWED_ADMIN_ORIGINS       CSV of apps/web origins for CORS (no localhost in prod)
#   TZ=America/Sao_Paulo        ensures `dhEmi` carries -03:00 offset; SEFAZ wants
#                               the issuer's local time.
#
# Producao only: requires NFE_ALLOW_PRODUCAO=true to clear the safety guard
# (see src/safety/assertSafeTpAmb).
