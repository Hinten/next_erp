# Firebase App Hosting backend config for apps/mercado-livre.
# API-only service for the Mercado Livre sales-channel integration: OAuth
# connect, and the ML notification webhook receiver. Heavy/async work (order
# import, stock sync, notification processing) is dispatched to the nested
# Cloud Functions codebase (apps/mercado-livre/functions).
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 20
  minInstances: 0 # scale-to-zero: a per-channel backend costs only per request
  concurrency: 80
  # Set EXPLICITLY rather than inheriting the platform default, because one
  # route is genuinely long-running: the manual stock push (#819) is synchronous
  # and can issue up to ~50 produtos' worth of `PUT /items` calls at concurrency
  # 2. Its own wall-clock budget (MERCADO_LIVRE_STOCK_MANUAL_DEADLINE_MS,
  # default 120s) is the real guarantee — it reports the remainder as
  # `nao-tentado` instead of letting the request die — and this ceiling sits
  # above it so the deadline, not the platform, is what ends the request.
  timeoutSeconds: 180
# Env (set per-environment in the Firebase console → App Hosting → Environment
# variables, or via Cloud Secret Manager for secrets; required unless marked
# OPTIONAL):
#   FIREBASE_PROJECT_ID          OPTIONAL — auto-detected on App Hosting/Cloud Run
#                                (GOOGLE_CLOUD_PROJECT / FIREBASE_CONFIG); set only to
#                                override, or in local dev without a service account
#   FIREBASE_DATABASE_ID         Firestore database id (default: "default")
#   MERCADO_LIVRE_CLIENT_ID      ML application id             (Secret Manager)
#   MERCADO_LIVRE_CLIENT_SECRET  ML application secret         (Secret Manager)
#   MERCADO_LIVRE_STATE_SECRET   HMAC key for the OAuth state  (Secret Manager)
#   MERCADO_LIVRE_PUBLIC_URL     this backend's public origin — used to build the
#                                OAuth redirect_uri (must match the URI registered
#                                in the Mercado Livre application dashboard)
#   WEB_APP_URL                  apps/web origin (the callback redirects back here)
#   ALLOWED_ADMIN_ORIGINS        CSV of apps/web origins for CORS. ⚠️ REQUIRED in prod:
#                                localhost is no longer implicitly allowed (#821/T5),
#                                so an unset value allows NO origin at all.
#   MERCADO_LIVRE_PKCE_ENABLED   OPTIONAL — `1` drives the OAuth connect flow with
#                                PKCE (#821). ⚠️ Must match the PKCE toggle on the
#                                registered application: once ML's toggle is on the
#                                code_challenge/code_verifier parameters are MANDATORY,
#                                so flip both together. Not a secret — a plain env var
#                                in the console, not below.
#   MERCADO_LIVRE_WEBHOOK_LOG_HEADERS
#                                OPTIONAL — webhook header-inventory diagnostic (#811).
#                                Unset: log each new header shape once per instance;
#                                `all` = every request; `off` = disabled. Not a secret,
#                                so it is set as a plain env var in the console, not below.

env:
  - variable: MERCADO_LIVRE_CLIENT_ID
    secret: mercado-livre-client-id
    availability:
      - RUNTIME

  - variable: MERCADO_LIVRE_CLIENT_SECRET
    secret: mercado-livre-client-secret
    availability:
      - RUNTIME

  - variable: MERCADO_LIVRE_STATE_SECRET
    secret: mercado-livre-state-secret
    availability:
      - RUNTIME
