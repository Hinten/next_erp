# Firebase App Hosting backend config for apps/mercado-livre.
# API-only service for the Mercado Livre sales-channel integration: OAuth
# connect, and the ML notification webhook receiver. Heavy/async work (order
# import, stock sync, notification processing) is dispatched to the nested
# Cloud Functions codebase (apps/mercado-livre/functions).
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 20
  # ⚠️ DECISION (#812) — deliberately kept at 0. Read this before changing it.
  #
  # The hazard is real and documented: Mercado Livre wants a 200 within roughly
  # 500 ms and disables a topic after repeated failures, while a cold instance
  # must boot Next.js, load the route module, initialise firebase-admin, mint an
  # ADC/metadata token and issue an HTTPS enqueue RPC to cloudtasks.googleapis.com
  # before it can ack. Low traffic makes this WORSE, not better: an account with
  # sparse notifications guarantees a cold instance for most deliveries.
  #
  # What was rejected: `minInstances: 1`, i.e. one always-on Cloud Run instance
  # at the `cpu: 1` / `memoryMiB: 512` configured below, billed at the idle
  # vCPU-second + GiB-second rates × ~730 h/month in the deploy region, for every
  # channel backend that adopts the same reasoning.
  #   ⚠️ Fill in the current figure from Cloud Run pricing for THIS region before
  #   citing it in a review — do not carry over a number from another doc.
  #
  # What is accepted instead: `sweepMercadoLivreMissedFeeds` (functions/src/index.ts),
  # the daily 05:00 `missed_feeds` backstop, recovers exactly this failure —
  # anything ML could not deliver a 200 to, which a blown ack window is. The cost
  # of the trade is LATENCY, not loss: a notification dropped at 05:01 is
  # recovered on the next morning's run, up to ~24 h later. That is acceptable
  # for payments/shipments/items reconciliation and would NOT be for anything
  # user-facing in real time.
  #
  # Revisit if: warm-path p99 approaches 500 ms, ML actually disables a topic, or
  # the daily-recovery latency starts showing up in operations. The measurement
  # runbook (which Cloud Logging query, how to force a cold start) is in
  # functions/DEPLOY.md → "Warm-path ack latency".
  minInstances: 0 # scale-to-zero: a per-channel backend costs only per request
  concurrency: 80
  # Set EXPLICITLY rather than inheriting the platform default, because one
  # route is genuinely long-running: the manual stock push (#819) is synchronous
  # and can issue up to ~50 produtos' worth of `PUT /items` calls at concurrency
  # 2. Its own wall-clock budget (MERCADO_LIVRE_STOCK_MANUAL_DEADLINE_MS,
  # default 120s) is the real guarantee — it reports the remainder as
  # `nao-tentado` instead of letting the request die — and this ceiling sits
  # above it so the deadline, not the platform, is what ends the request.
  timeoutSeconds: 180
# Env (set per-environment in the Firebase console → App Hosting → Environment
# variables, or via Cloud Secret Manager for secrets; required unless marked
# OPTIONAL):
#   FIREBASE_PROJECT_ID          OPTIONAL — auto-detected on App Hosting/Cloud Run
#                                (GOOGLE_CLOUD_PROJECT / FIREBASE_CONFIG); set only to
#                                override, or in local dev without a service account
#   FIREBASE_DATABASE_ID         Firestore database id (default: "default")
#   MERCADO_LIVRE_CLIENT_ID      ML application id             (Secret Manager)
#   MERCADO_LIVRE_CLIENT_SECRET  ML application secret         (Secret Manager)
#   MERCADO_LIVRE_STATE_SECRET   HMAC key for the OAuth state  (Secret Manager)
#   MERCADO_LIVRE_PUBLIC_URL     this backend's public origin — used to build the
#                                OAuth redirect_uri (must match the URI registered
#                                in the Mercado Livre application dashboard)
#   WEB_APP_URL                  apps/web origin (the callback redirects back here)
#   ALLOWED_ADMIN_ORIGINS        CSV of apps/web origins for CORS. ⚠️ REQUIRED in prod:
#                                localhost is no longer implicitly allowed (#821/T5),
#                                so an unset value allows NO origin at all.
#   MERCADO_LIVRE_PKCE_ENABLED   OPTIONAL — `1` drives the OAuth connect flow with
#                                PKCE (#821). ⚠️ Must match the PKCE toggle on the
#                                registered application: once ML's toggle is on the
#                                code_challenge/code_verifier parameters are MANDATORY,
#                                so flip both together. Not a secret — a plain env var
#                                in the console, not below.
#   MERCADO_LIVRE_WEBHOOK_LOG_HEADERS
#                                OPTIONAL — webhook header-inventory diagnostic (#811).
#                                Unset: log each new header shape once per instance;
#                                `all` = every request; `off` = disabled. Not a secret,
#                                so it is set as a plain env var in the console, not below.

env:
  # ⚠️ The queue region this backend ENQUEUES to. Not a secret, and NOT optional:
  # unset, three of the five enqueuers fall through to
  # `MERCADO_LIVRE_TASKS_REGION?.trim() || FUNCTIONS_REGION || 'us-east5'`
  # (mlMassImportTasks / mlPriceSyncTasks / mlNfeUploadTasks / mlStockTasks) while
  # their queues live in us-east1 — the value functions/build.mjs inlines. The
  # Admin SDK then resolves us-central1 and the task is SILENTLY DROPPED: the
  # route reports success, no failure document is written, and `/enviar-nfe` has
  # no sweep behind it to notice. Only the webhook path was immune, because
  # mlTasks.ts hardcodes us-east1.
  #
  # It must equal MERCADO_LIVRE_TASKS_REGION in the shell that deploys the
  # functions codebase; `node tools/deploy-env/preflight.mjs mercado-livre` prints
  # the value being baked in so the two can be compared. See #1108 / #1121.
  - variable: MERCADO_LIVRE_TASKS_REGION
    value: us-east1
    availability:
      - RUNTIME

  - variable: MERCADO_LIVRE_CLIENT_ID
    secret: MERCADO_LIVRE_CLIENT_ID
    availability:
      - RUNTIME

  - variable: MERCADO_LIVRE_CLIENT_SECRET
    secret: MERCADO_LIVRE_CLIENT_SECRET
    availability:
      - RUNTIME

  - variable: MERCADO_LIVRE_STATE_SECRET
    secret: MERCADO_LIVRE_STATE_SECRET
    availability:
      - RUNTIME
