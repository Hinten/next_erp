# Firebase App Hosting backend config for apps/loja-integrada.
# API-only service for the Loja Integrada marketplace channel. Step 1 of the
# master plan shipped the bare scaffold (`GET /api/health`); step 2 adds the
# Firebase Admin init, the CORS proxy and the credential routes (token save,
# validity renewal, removal and status). The poller and the webhook arrive in
# later steps.
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 20
  # Deliberately 0 (master plan D13). The 5-minute poll is the guaranteed path
  # for new orders; the webhook only makes it faster, so a cold start that
  # misses a push costs latency, never correctness. Do not copy the push-ack
  # reasoning of the other channel backends: it does not apply here.
  minInstances: 0 # scale-to-zero: a per-channel backend costs only per request
  concurrency: 80
# No `timeoutSeconds` — the platform default (300 s) is what
# `lib/lojaIntegrada/prazos.test.ts` compares the credential routes, the paid
# re-check route (pacer + read deadline) and the catalogue routes against. The
# catalogue's worst case is the largest: MAX_PAGINAS_CATALOGO_LI paced pages, each
# the pacer plus the read deadline, plus a margin — 10 x (2 s + 20 s) + 30 s =
# 250 s. A pin below that turns the test red.
#
# No `runConfig.vpcAccess` — this channel needs no static egress IP (master plan
# D3).
#
# Environment this backend reads (step 2). None of it gets an `env:` row below,
# on purpose, and the list is kept here so the next step that reads a variable
# declares it in the same change:
#
#   FIREBASE_PROJECT_ID     OPTIONAL. `lib/firebase/admin.ts` resolves the project
#                           from this, then GOOGLE_CLOUD_PROJECT, then
#                           FIREBASE_CONFIG.projectId (the one App Hosting actually
#                           injects), then the service account. Leave it unset on a
#                           deployed backend.
#   FIREBASE_DATABASE_ID    OPTIONAL. Unset means the database named `default`
#                           (Enterprise names it `default`, never `(default)`).
#                           Never add a blank `env:` row for it: an empty string is
#                           a value, not an absence, and would be passed through.
#   ALLOWED_ADMIN_ORIGINS   CSV of apps/web origins for CORS, read by `proxy.ts`
#                           only. REQUIRED in production: localhost is allowed
#                           outside production only (#821/T5), so an unset value
#                           allows NO origin at all and every browser call fails
#                           CORS. It is a console variable like the other
#                           backends', not a secret.
#
# The read switch and the write valves (step 2b, `lib/lojaIntegrada/core/valvulas.ts`).
# Comment rows ONLY: an `off` baked into an `env:` row might override a console
# flip during the window (App Hosting's precedence between the two is unverified).
# Every one stays UNSET until the migration window (master plan §5 items 1, 3 and
# 8; mock only before it, D17), and is then set alike in this backend's App Hosting
# console and in the functions codebase's `.env.deploy`
# (apps/loja-integrada/functions/DEPLOY.md):
#
#   LOJA_INTEGRADA_CHAMADAS                The read switch, read by the credential routes,
#                                          the paid re-check route (GET
#                                          …/pedidos/[pedidoId]/pagamento) and the four
#                                          catalogue routes (GET …/conta/[id]/categorias,
#                                          …/marcas, …/grades, …/grades/[gradeId]): only
#                                          the exact `on` lets them call Loja Integrada;
#                                          anything else answers 503
#                                          LI_CHAMADAS_DESLIGADAS before any call (the
#                                          re-check answers from the ERP's contested
#                                          mirror instead when it is open; the catalogue
#                                          routes read no Firestore at all then). The
#                                          label routing route reads no switch: it calls
#                                          nothing.
#   LOJA_INTEGRADA_MODO_ESTOQUE            Write valves, `off | dry-run | on`; only the
#   LOJA_INTEGRADA_MODO_PRECO              exact `on` writes and the exact `dry-run`
#   LOJA_INTEGRADA_MODO_ANUNCIO            diffs. Read from step 7 onward.
#   LOJA_INTEGRADA_MODO_WEBHOOK_REGISTRO
#   LOJA_INTEGRADA_CANARIO_ESTOQUE         Canary lists, read from step 7 onward:
#   LOJA_INTEGRADA_CANARIO_PRECO           unset = no target, exactly `*` = every
#   LOJA_INTEGRADA_CANARIO_ANUNCIO         target, else `<contaId>:<n>,…` (see the
#                                          root `.env.example`).
#
#   LOJA_INTEGRADA_MODO_RASTREIO           ⚠️ The RASTREIO pair (the status write-back,
#   LOJA_INTEGRADA_CANARIO_RASTREIO        step 7) is the exception to "set alike": it
#                                          has NO reader in this backend. The write-back
#                                          runs in the functions codebase only — its
#                                          trigger, the writes queue and its varredura —
#                                          so set BOTH in its `.env.deploy`; a row for
#                                          either here does nothing.
#
# Read ONLY by the nested functions codebase (step 3), so a row for any of them
# here would be read by nothing: LOJA_INTEGRADA_TASKS_REGION,
# LOJA_INTEGRADA_TASKS_DISABLED and LOJA_INTEGRADA_POLL_LOOKBACK_H live in
# `functions/.env.deploy`. This backend gets its own LOJA_INTEGRADA_TASKS_REGION
# (and the sweep-only valve) in step 4, with its first Cloud Tasks enqueuer, and
# it must then equal the FUNCTIONS_REGION the functions bundle was built for.
#
# No `env:` block: nothing here needs a value baked into the manifest.
