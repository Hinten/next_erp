# Firebase App Hosting backend config for apps/mercado-pago.
# API-only service for the Mercado Pago payments integration: OAuth connect
# (account linking) + the connected-account status route. Heavy/async work
# (payment-link generation, webhook reconciliation) lands in later PRs on a
# nested Cloud Functions codebase — NOT here yet.
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 20
  minInstances: 0 # scale-to-zero: a per-channel backend costs only per request
  concurrency: 80
# Env (set per-environment in the Firebase console → App Hosting → Environment
# variables, or via Cloud Secret Manager for secrets; required unless marked
# OPTIONAL):
#   FIREBASE_PROJECT_ID          OPTIONAL — auto-detected on App Hosting/Cloud Run
#                                (GOOGLE_CLOUD_PROJECT / FIREBASE_CONFIG); set only to
#                                override, or in local dev without a service account
#   FIREBASE_DATABASE_ID         Firestore database id (default: "default")
#   MERCADO_PAGO_CLIENT_ID       MP application id              (Secret Manager)
#   MERCADO_PAGO_CLIENT_SECRET   MP application secret          (Secret Manager)
#   MERCADO_PAGO_STATE_SECRET    HMAC key for the OAuth state   (Secret Manager)
#   MERCADO_PAGO_PUBLIC_URL      this backend's public origin — used to build the
#                                OAuth redirect_uri (must match the URI registered
#                                in the Mercado Pago application dashboard)
#   WEB_APP_URL                  apps/web origin (the callback redirects back here)
#   ALLOWED_ADMIN_ORIGINS        CSV of apps/web origins for CORS (no localhost in prod)

env:
  - variable: MERCADO_PAGO_CLIENT_ID
    secret: mercado-pago-client-id
    availability:
      - RUNTIME

  - variable: MERCADO_PAGO_CLIENT_SECRET
    secret: mercado-pago-client-secret
    availability:
      - RUNTIME

  - variable: MERCADO_PAGO_STATE_SECRET
    secret: mercado-pago-state-secret
    availability:
      - RUNTIME
