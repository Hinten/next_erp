# Firebase App Hosting backend config for apps/shopee.
# API-only service for the Shopee Open Platform channel integration: OAuth
# connect, account status, the access-token refresh, the cached taxonomy reads
# (steps 1-2 and 10 of the master plan) and — since step 3 — the push receiver
# at /api/webhooks/shopee, which acks fast and dispatches the work to the
# nested Cloud Functions codebase (apps/shopee/functions) the way
# apps/mercado-livre does.
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 20
  # ⚠️ DECISION (P3, master plan §2.1) — deliberately kept at 0. Read this
  # before changing it. Same reasoning `apps/mercado-livre/apphosting.yaml`
  # (#812) already worked through for a sibling channel backend.
  #
  # Shopee's push notification waits roughly 3 s for a 2xx with an EMPTY body,
  # and a cold Next instance has to boot Next.js, load the route module,
  # initialise firebase-admin and issue an HTTPS enqueue RPC before it can ack
  # — a 2–6 s cold boot. Shopee's own retry ladder is +5 min / +30 min / +3 h,
  # and it disables a subscription after more than 600 pushes in 6 hours with
  # under 30% success — after which nothing is redelivered.
  #
  # What was rejected: `minInstances: 1` — one always-on Cloud Run instance at
  # the `cpu: 1` / `memoryMiB: 512` configured below, billed at the idle
  # vCPU-second + GiB-second rates for every channel backend that adopts the
  # same reasoning.
  #
  # What is accepted instead: the receiver now EXISTS (step 3), so a cold start
  # can genuinely miss a push — and a missed push is not lost, because every
  # push that fails to enqueue is persisted as `failed` and drained by
  # `reprocessShopeeNotifications` (every 30 min). What that backstop cannot
  # recover is a push we never received at all; the lost-push sweep and the
  # push-health monitor that close THAT gap are step 4. Until they ship the
  # exposure is a cold start on a push Shopee then retries three times over
  # ~3.5 h — a LATENCY cost, not a correctness one.
  #
  # Revisit if the step-4 monitor reports repeated missed pushes or Shopee
  # actually disables the subscription.
  minInstances: 0 # scale-to-zero: a per-channel backend costs only per request
  concurrency: 80
# No `timeoutSeconds` — every route here today is a fast Firestore read/write
# plus at most TWO Shopee API calls: five taxonomy routes read the category
# tree (`get_category`, unpaged) as well as their own endpoint — the four
# leaf-gated ones before the gate, `recomendacao-categoria` to resolve the rows
# — and both legs are cached for 15 min, so only a cold window pays either. Nothing
# loops, fans out or runs long the way ML's manual stock push does. Revisit
# this if a route ever pages a slow endpoint itself (`get_brand_list` is the
# candidate — the caller loops today, deliberately).
#
# No `runConfig.vpcAccess` — Shopee's IP allow-list (master plan P2 option D:
# a static-egress VPC connector + reserved IP) is migration-window
# infrastructure (root CLAUDE.md rule 8), not something this step provisions.
# See #1208 when that window is scheduled; no issue opened yet.
#
# Env (set per-environment in the Firebase console → App Hosting → Environment
# variables, or via Cloud Secret Manager for secrets; required unless marked
# OPTIONAL):
#   FIREBASE_PROJECT_ID     OPTIONAL — auto-detected on App Hosting/Cloud Run
#                           (via FIREBASE_CONFIG.projectId; Cloud Run sets no project env var); set only to
#                           override, or in local dev without a service account
#   FIREBASE_DATABASE_ID    Firestore database id (default: "default")
#   SHOPEE_PARTNER_ID       Shopee Open Platform partner id       (Secret Manager)
#   SHOPEE_PARTNER_KEY      Shopee Open Platform partner key      (Secret Manager)
#   SHOPEE_STATE_SECRET     HMAC key for the OAuth state          (Secret Manager)
#   SHOPEE_SANDBOX          OPTIONAL — exactly "1" selects the Shopee sandbox
#                           hosts; unset/anything else means PRODUCTION. This
#                           is the OPPOSITE polarity of MELHOR_ENVIO_SANDBOX,
#                           because production here reuses the live legacy
#                           Flutter app's registered application.
#   SHOPEE_API_HOST         OPTIONAL — override the resolved API host
#   SHOPEE_AUTH_HOST        OPTIONAL — override the resolved consent host
#   SHOPEE_VARIATIONS_PATH  OPTIONAL — override the `get_variations` API path.
#                           The doc page's path/url/test_url say
#                           /api/v2/product/get_variation_tree while all four of
#                           its samples call /api/v2/product/get_variations; we
#                           default to the samples. ⚠️ The path is inside the
#                           HMAC base string, so the wrong one fails as a SIGN
#                           error, not a 404. Not a secret.
#   SHOPEE_PUBLIC_URL       this backend's public origin — used to build the
#                           OAuth redirect_uri (must match the URI registered
#                           in the Shopee Open Platform application)
#   SHOPEE_PUSH_CALLBACK_URL  the EXACT push callback URL registered in the
#                           Shopee Open Platform console. It goes into the HMAC
#                           base string byte for byte — a trailing slash or a
#                           http/https difference changes the digest, so every
#                           push answers 401. Unset/blank ⇒ the receiver answers
#                           503 rather than accepting unverified pushes.
#                           Registration itself is #1534.
#   SHOPEE_TASKS_REGION     region of processShopeeNotification and its Cloud
#                           Tasks queue. MUST equal the FUNCTIONS_REGION the
#                           nested codebase was built with: without the
#                           region-qualified name the Admin SDK targets
#                           us-central1 and the task is SILENTLY dropped while
#                           the receiver still answers 204 (#1108). App Hosting
#                           does not expose its own region as an env var, so
#                           there is nothing to derive it from.
#   SHOPEE_TASKS_DISABLED   OPTIONAL — exactly "1" turns the enqueue off; the
#                           receiver then persists every push as `failed` and
#                           the 30-minute reprocess sweep drains it (sweep-only
#                           mode). Use before the functions IAM is granted;
#                           never a silent drop.
#   WEB_APP_URL             apps/web origin (the callback redirects back here)
#   ALLOWED_ADMIN_ORIGINS   CSV of apps/web origins for CORS. ⚠️ REQUIRED in
#                           prod: localhost is no longer implicitly allowed
#                           (#821/T5), so an unset value allows NO origin at all.

env:
  # Region of `processShopeeNotification` and its Cloud Tasks queue, read by the
  # receiver's enqueuer (lib/shopee/shopeeTasks.ts).
  #
  # ⚠️ DELIBERATELY BLANK, and blank is the SAFE state. `requireRegion` treats a
  # blank as unset and falls through to FUNCTIONS_REGION, which App Hosting does
  # not set — so today the enqueue THROWS, the receiver persists the push as
  # `failed`, and the 30-minute sweep drains it. Nothing is lost. Baking a region
  # here before the functions codebase is actually deployed would buy the
  # opposite: a well-formed queue path pointing at a queue that does not exist,
  # which the Admin SDK resolves to us-central1 and DROPS silently while the
  # route still answers 204 (#1108). A refused enqueue is recoverable; a dropped
  # one is not even visible.
  #
  # Fill it in — here or in the console — in the SAME change that deploys
  # apps/shopee/functions (step 22, #1530), with the value
  # `node tools/deploy-env/preflight.mjs shopee` prints for FUNCTIONS_REGION in
  # the deploying shell. The two must be equal; App Hosting exposes no region
  # variable of its own, so there is nothing to derive it from.
  - variable: SHOPEE_TASKS_REGION
    value: ''
    availability:
      - RUNTIME

  - variable: SHOPEE_PARTNER_ID
    secret: SHOPEE_PARTNER_ID
    availability:
      - RUNTIME

  - variable: SHOPEE_PARTNER_KEY
    secret: SHOPEE_PARTNER_KEY
    availability:
      - RUNTIME

  - variable: SHOPEE_STATE_SECRET
    secret: SHOPEE_STATE_SECRET
    availability:
      - RUNTIME
