name: Configuracoes E2E

# E2E do módulo User+Cargo. Disparado apenas quando o PR toca arquivos do
# módulo ou suas dependências transitivas (schemas, auth, fixtures, etc.).
# Padrão para futuros E2Es filtrados: ver bullet em CLAUDE.md → "When making changes".
on:
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/web/app/(app)/configuracoes/cargos/**'
      - 'apps/web/app/(app)/configuracoes/usuarios/**'
      - 'apps/web/app/(app)/configuracoes/_components/**'
      - 'apps/web/lib/admin/users.ts'
      - 'apps/web/lib/auth/**'
      - 'apps/web/e2e/configuracoes.spec.ts'
      - 'apps/web/e2e/_helpers/**'
      - 'apps/web/e2e/_setup/**'
      - 'apps/web/playwright.config.ts'
      - 'apps/integrations/app/api/admin/users/**'
      - 'apps/integrations/lib/firebase/admin.ts'
      - 'packages/schemas/src/cargo.ts'
      - 'packages/schemas/src/usuario.ts'
      - 'packages/auth/**'
      - 'packages/data/**'
      - 'tools/test-fixtures/**'
      - '.github/workflows/configuracoes-e2e.yml'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuracoes-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      E2E_SU_EMAIL: ${{ secrets.E2E_SU_EMAIL }}
      E2E_SU_PASSWORD: ${{ secrets.E2E_SU_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @delfrance/web exec playwright install --with-deps chromium 2>&1 | tee -a /tmp/ci.log

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @delfrance/web exec playwright install-deps chromium 2>&1 | tee -a /tmp/ci.log

      - name: e2e configuracoes (web)
        run: pnpm --filter @delfrance/web exec playwright test --project=configuracoes 2>&1 | tee -a /tmp/ci.log

      # Em caso de falha, posta o tail do output como comentário no PR —
      # mesmo objetivo do antigo post-ci-logs.yml, mas dentro do próprio run.
      - name: Post failure logs to PR
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WF: ${{ github.workflow }}
        run: |
          tail -c 12000 /tmp/ci.log > /tmp/logs.txt 2>/dev/null || true
          if [ ! -s /tmp/logs.txt ]; then
            echo "(sem output capturado — verifique o run no GitHub)" > /tmp/logs.txt
          fi
          {
            echo "<details>"
            echo "<summary>CI failed — \`$WF\` em <code>${HEAD_SHA:0:7}</code> (<a href=\"$RUN_URL\">ver run</a>) — últimos 12KB do output</summary>"
            echo
            echo '```'
            cat /tmp/logs.txt
            echo '```'
            echo
            echo "</details>"
          } > /tmp/body.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/body.md
