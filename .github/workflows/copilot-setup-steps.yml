name: Copilot Setup Steps

# Validate this setup workflow when it changes, and allow manual reruns from
# the Actions tab after it lands on the default branch.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

jobs:
  # The job name must be exactly `copilot-setup-steps` or Copilot cloud agent
  # will ignore this workflow and fall back to the default environment.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The Firebase Emulator Suite runs on the JVM, and firebase-tools >= 15
      # requires JDK 21+.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin. Keeping
          # it unpinned is what guarantees this prewarm environment
          # matches the one CI actually installs with.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Shares ci.yml's `pnpm-store-` key namespace on purpose. Under a private
      # `copilot-` prefix this lane was the only writer, so it started cold on
      # almost every run; the shared namespace is refreshed by every merge to the
      # default branch, and default-branch caches are readable from any branch.
      # The Next.js cache below stays on a `copilot-` prefix — its build genuinely
      # differs from what the CI lanes store. The Playwright cache no longer does:
      # it holds the same browser build the e2e lanes download, so it shares their
      # `playwright-` namespace and is keyed on the Playwright version instead of
      # the lockfile. See e2e-emulator.yml for why that key, and not this one.
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Next.js emulator build artifacts
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: copilot-nextjs-web-emulator-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            copilot-nextjs-web-emulator-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install firebase-tools
        run: npm i -g firebase-tools@15.15.0

      # This lane does not use the Playwright container image, so it fetches the
      # browser and its apt system libraries itself — the same shape as
      # e2e-emulator.yml, and carrying the same hazard.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          # Extract the semver rather than taking the last field: a pnpm notice on
          # stdout would otherwise make this multi-line, and a multi-line value
          # written to $GITHUB_OUTPUT without a delimiter fails opaquely.
          v="$(pnpm --filter @delfrance/web exec playwright --version | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | head -1)"
          if [ -z "$v" ]; then
            echo "::error::could not resolve the Playwright version — the cache key below would collapse to a constant and serve one version's browsers to every other"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # ⚠️ Playwright's system-deps install shells out to `apt-get update`, which
      # exits 100 when ANY configured source fails — including the two
      # packages.microsoft.com repos on the runner image, which answered 403 on
      # 2026-08-27 and reddened the emulator gate. Every package it installs comes
      # from the Ubuntu archive, so drop the rest. Full account, and the two
      # controls this check carries, in e2e-emulator.yml.
      #
      # ⚠️ Deleting this step fails nothing until the next 403, so
      # `ci-lane-gates.test.js` asserts it precedes the apt step below.
      - name: Trim apt sources to the Ubuntu archive
        run: |
          shopt -s nullglob
          for f in /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            if grep -qE 'ubuntu[.]com|apt-mirrors[.]txt' "$f"; then continue; fi
            sudo mv "$f" "$f.disabled"
            echo "disabled $f"
          done
          if ! grep -rqE 'ubuntu[.]com|apt-mirrors[.]txt' --exclude='*.disabled' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
            echo "::error::the apt trim left no Ubuntu archive source — refusing to continue"
            exit 1
          fi

      - name: Chromium system deps (apt)
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @delfrance/web exec playwright install-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Chromium system deps failed (attempt $attempt/3) — retrying"
              sleep "${attempt}0"
            fi
          done
          echo "::error::Chromium system deps failed 3 times — the Ubuntu archive itself is unreachable, which the source trim above cannot help with"
          exit 1

      - name: Ensure Chromium
        run: pnpm --filter @delfrance/web exec playwright install chromium

      - name: Build functions bundle
        env:
          FUNCTIONS_REGION: us-central1
        run: pnpm --filter @delfrance/functions build

      - name: Build web for emulator workflows
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'true'
          NEXT_PUBLIC_FIREBASE_EMULATOR_HOST: 127.0.0.1
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-erp
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: default
          NEXT_PUBLIC_FUNCTIONS_REGION: us-central1
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-erp.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-erp.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:demo'
          E2E_SOURCEMAPS: 'true'
        run: pnpm --filter @delfrance/web exec next build

      - name: Verify toolchain availability
        run: |
          firebase --version
          pnpm --filter @delfrance/web exec playwright --version