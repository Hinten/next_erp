name: Copilot Setup Steps

# Validate this setup workflow when it changes, and allow manual reruns from
# the Actions tab after it lands on the default branch.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

jobs:
  # The job name must be exactly `copilot-setup-steps` or Copilot cloud agent
  # will ignore this workflow and fall back to the default environment.
  copilot-setup-steps:
    # Playwright 1.60.0 cannot install Chromium on Ubuntu 26.04 (#2076).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The Firebase Emulator Suite runs on the JVM, and firebase-tools >= 15
      # requires JDK 21+.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin. Keeping
          # it unpinned is what guarantees this prewarm environment
          # matches the one CI actually installs with.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Shares ci.yml's `pnpm-store-` key namespace on purpose. Under a private
      # `copilot-` prefix this lane was the only writer, so it started cold on
      # almost every run; the shared namespace is refreshed by every merge to the
      # default branch, and default-branch caches are readable from any branch.
      # The Next.js cache below stays on a `copilot-` prefix — its build genuinely
      # differs from what the CI lanes store. The Playwright cache is keyed on the
      # Playwright version instead of the lockfile; its own step says why.
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Next.js emulator build artifacts
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: copilot-nextjs-web-emulator-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            copilot-nextjs-web-emulator-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install firebase-tools
        run: npm i -g firebase-tools@15.25.0

      # This job CANNOT run in the Playwright container that every e2e lane uses.
      # Copilot honours six keys of this job (steps, permissions, runs-on,
      # services, snapshot, timeout-minutes) and ignores the rest, `container:`
      # included. The agent then works in this runner's environment, so the browser
      # and its system libraries have to land on the host. So this job fetches both
      # itself, and it is the last one in the repo that still depends on apt.
      # e2e-emulator.yml did the same until 2026-11-11, when an hour-long Ubuntu
      # archive DNS outage cancelled its required gate. That outage is survivable
      # here because this check is required nowhere, and a failed setup step only
      # makes Copilot skip the remaining steps and start work in whatever state
      # the environment is in.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          # Extract the semver rather than taking the last field: a pnpm notice on
          # stdout would otherwise make this multi-line, and a multi-line value
          # written to $GITHUB_OUTPUT without a delimiter fails opaquely.
          v="$(pnpm --filter @delfrance/web exec playwright --version | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | head -1)"
          if [ -z "$v" ]; then
            echo "::error::could not resolve the Playwright version — the cache key below would collapse to a constant and serve one version's browsers to every other"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Keyed on the Playwright version, NOT on hashFiles('pnpm-lock.yaml') like the
      # caches around it. The browser build depends on that version alone, while
      # the lockfile changes on most PRs, so a lockfile key would start cold on
      # nearly every run. No `restore-keys` on purpose: a prefix hit would restore
      # another version's browsers, which `playwright install` would download again
      # anyway while the post-step saved both sets. That install revalidates
      # whatever it finds, so a partial or stale restore heals itself.
      #
      # ⚠️ It pays less than it looks. Only DEFAULT-BRANCH cache entries are
      # readable from every branch, and this workflow's `push:` is `paths:`-filtered
      # to this file, so a key reaches `main`'s scope only when a PR touching this
      # file merges.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # ⚠️ Playwright's system-deps install shells out to `apt-get update`, which
      # exits 100 when ANY configured source fails, including a source holding
      # nothing it will install. The runner image ships two packages.microsoft.com
      # repos (azure-cli, prod). On 2026-08-27 both answered 403 and reddened the
      # emulator gate (run 33069232271, attempt 1), while every package Playwright
      # actually installs (9 font packages) sat on azure.archive.ubuntu.com and
      # fetched fine. A concurrent run on another runner passed that same minute,
      # so it is a per-edge-node flake that recurs. Every package it installs comes
      # from the Ubuntu archive, so drop the rest.
      #
      # Two controls, so the trim cannot go wrong silently in either direction: the
      # `continue` keeps any file naming an Ubuntu host (so a future deb822 image
      # that moves the archive into sources.list.d survives this), and the
      # post-check exits 1 if the trim left no Ubuntu source at all.
      #
      # ⚠️ Both greps anchor to a NON-COMMENT line (`^[^#]*`). Matching anywhere in
      # the file would let a third-party source survive on nothing more than a
      # `# see https://help.ubuntu.com/…` line in its own header (some vendor
      # packages ship exactly that), and the trim would silently stop covering the
      # repo it exists to drop. deb822 is unaffected:
      # `URIs: http://azure.archive.ubuntu.com/ubuntu/` carries no `#`.
      #
      # ⚠️ The trim cannot help when the Ubuntu archive ITSELF is unreachable, which
      # is what took the emulator lane down on 2026-11-11 and moved it into the
      # container.
      #
      # ⚠️ Deleting this step fails nothing until the next 403, so
      # `ci-lane-gates.test.js` asserts it precedes the apt step below.
      - name: Trim apt sources to the Ubuntu archive
        run: |
          shopt -s nullglob
          for f in /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            if grep -qE '^[^#]*(ubuntu[.]com|apt-mirrors[.]txt)' "$f"; then continue; fi
            sudo mv "$f" "$f.disabled"
            echo "disabled $f"
          done
          if ! grep -rqE '^[^#]*(ubuntu[.]com|apt-mirrors[.]txt)' --exclude='*.disabled' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
            echo "::error::the apt trim left no Ubuntu archive source — refusing to continue"
            exit 1
          fi

      - name: Chromium system deps (apt)
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @delfrance/web exec playwright install-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Chromium system deps failed (attempt $attempt/3) — retrying"
              sleep "${attempt}0"
            fi
          done
          echo "::error::Chromium system deps failed 3 times — the Ubuntu archive itself is unreachable, which the source trim above cannot help with"
          exit 1

      - name: Ensure Chromium
        run: pnpm --filter @delfrance/web exec playwright install chromium

      - name: Build functions bundle
        env:
          FUNCTIONS_REGION: us-central1
        run: pnpm --filter @delfrance/functions build

      - name: Build web for emulator workflows
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'true'
          NEXT_PUBLIC_FIREBASE_EMULATOR_HOST: 127.0.0.1
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-erp
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: default
          NEXT_PUBLIC_FUNCTIONS_REGION: us-central1
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-erp.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-erp.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:demo'
          E2E_SOURCEMAPS: 'true'
        run: pnpm --filter @delfrance/web exec next build

      - name: Verify toolchain availability
        run: |
          firebase --version
          pnpm --filter @delfrance/web exec playwright --version
