name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint 2>&1 | tee -a /tmp/ci.log

      - name: Typecheck
        run: pnpm turbo run typecheck 2>&1 | tee -a /tmp/ci.log

      - name: Test
        run: pnpm turbo run test 2>&1 | tee -a /tmp/ci.log

      - name: Build
        run: pnpm turbo run build 2>&1 | tee -a /tmp/ci.log

      # Em caso de falha, posta o tail do output como comentário no PR —
      # mesmo objetivo do antigo post-ci-logs.yml, mas dentro do próprio run.
      - name: Post failure logs to PR
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WF: ${{ github.workflow }}
        run: |
          tail -c 12000 /tmp/ci.log > /tmp/logs.txt 2>/dev/null || true
          if [ ! -s /tmp/logs.txt ]; then
            echo "(sem output capturado — verifique o run no GitHub)" > /tmp/logs.txt
          fi
          {
            echo "<details>"
            echo "<summary>CI failed — \`$WF\` em <code>${HEAD_SHA:0:7}</code> (<a href=\"$RUN_URL\">ver run</a>) — últimos 12KB do output</summary>"
            echo
            echo '```'
            cat /tmp/logs.txt
            echo '```'
            echo
            echo "</details>"
          } > /tmp/body.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/body.md
