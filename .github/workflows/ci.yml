name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    # `branches:` matches the PR's BASE, not its head — so the prefix entries
    # are what give a stacked PR (B -> A -> main) CI. Stack onto one of them; a
    # child based on any other prefix reports zero checks, not a failure.
    branches: [master, main, 'claude/**', 'feat/**', 'fix/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    # `turbo run build` compiles apps/functions, whose build.mjs inlines
    # FUNCTIONS_REGION and fails without it. Must match the Storage bucket region.
    env:
      FUNCTIONS_REGION: us-east1
      # Skip Next.js telemetry collection + its build-time notice in CI.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        # NF-e packages are excluded here because ci-nfe.yml owns their
        # offline + live test pipeline. The freight (Melhor Envio) packages are
        # likewise owned by ci-freight.yml (offline + the live sandbox lane,
        # whose *.sandbox.test.ts THROWS in CI without a token — so it must not
        # be collected here). The storage/functions packages are owned by
        # ci-storage.yml (unit + emulator suites). Lint / typecheck / build
        # above still cover the full graph so cross-package breaks surface.
        run: |
          pnpm turbo run test \
            --filter '!@delfrance/nfe-app' \
            --filter '!@delfrance/integrations-nfe' \
            --filter '!@delfrance/melhor-envio-app' \
            --filter '!@delfrance/integrations-freight-br' \
            --filter '!@delfrance/storage' \
            --filter '!@delfrance/functions'

      # Persist Next.js's incremental build cache across runs for every Next app
      # `turbo run build` compiles (apps/*/.next/cache — non-Next apps have none
      # and are ignored). Keyed on the head SHA (the ref actually built):
      # restore the newest prior cache via restore-keys, save this commit's.
      - name: Cache Next.js builds
        uses: actions/cache@v5
        with:
          path: apps/*/.next/cache
          key: nextjs-ci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            nextjs-ci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm turbo run build

  report-failure:
    name: Post failure logs on PR
    # Quando o job acima falha num PR, este job puxa o tail dos logs dos jobs
    # que falharam (via API actions:read) e posta como comentário no PR.
    # Substitui o antigo workflow externo post-ci-logs.yml — agora o próprio
    # workflow reporta a falha, sem depender de um workflow_run separado.
    needs: [lint-typecheck-test]
    if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      # `contents: read` is for the stale-base-hint step's `compare` API call
      # (and the checkout that supplies it) — not for this job's log fetching.
      contents: read
    steps:
      # Checked out ONLY to supply the stale-base-hint composite action. Pinned
      # to the BASE ref, never the PR head: this job holds `pull-requests: write`,
      # so the script it executes has to come from trusted `main` rather than
      # from the branch under test.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch failed job logs
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Lista os jobs deste run que terminaram em falha (este job ainda
          # está em execução, então não aparece como failure).
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > /tmp/failed-jobs.tsv
          if [ ! -s /tmp/failed-jobs.tsv ]; then
            echo "Nenhum job em falha encontrado — nada a reportar."
            # A step `exit 0` no longer ends the job now that commenting is its
            # own step — gate the remaining steps on this output instead.
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          {
            echo "## CI falhou"
            echo
            echo "Workflow \`${{ github.workflow }}\` no commit <code>${HEAD_SHA:0:7}</code> · [ver run completo]($RUN_URL)"
            echo
          } > /tmp/body.md
          while IFS=$'\t' read -r job_id job_name; do
            # tail -c 12000 mantém os últimos ~12KB (onde costuma estar o erro real).
            if ! gh api "repos/$REPO/actions/jobs/$job_id/logs" > "/tmp/job-$job_id.log" 2>/dev/null; then
              echo "(log indisponível — abra o run no GitHub)" > "/tmp/job-$job_id.log"
            fi
            {
              echo "<details>"
              echo "<summary>Job <code>$job_name</code> — últimos 12KB do log</summary>"
              echo
              echo '```'
              tail -c 12000 "/tmp/job-$job_id.log"
              echo
              echo '```'
              echo
              echo "</details>"
              echo
            } >> /tmp/body.md
          done < /tmp/failed-jobs.tsv

      # This lane runs no Playwright specs, so the per-spec culprit match never
      # fires here — what it contributes is the plain "your base is N commits
      # behind" advisory. Reads /tmp/job-*.log, so it runs after the fetch.
      - name: Stale-base hint
        if: ${{ steps.collect.outputs.found == 'true' }}
        uses: ./.github/actions/stale-base-hint
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: ${{ steps.collect.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # O hint vem primeiro — é o que evita alguém investigar uma falha que
          # a própria base já corrigiu. Arquivo vazio quando não há defasagem,
          # deixando o comentário idêntico ao formato anterior. O `touch` garante
          # que um hint pulado ou interrompido nunca quebre o comentário.
          touch /tmp/stale-hint.md
          cat /tmp/stale-hint.md /tmp/body.md > /tmp/comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md
