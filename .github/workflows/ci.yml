name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    # `branches:` matches the PR's BASE, not its head — so the prefix entries
    # are what give a stacked PR (B -> A -> main) CI. Stack onto one of them; a
    # child based on any other prefix reports zero checks, not a failure.
    #
    # `production` is the release base (main → production). It used to be omitted
    # on the grounds that the release PR is covered by the `push:` on `main`. That
    # is not enough: it closes a real coverage gap — ci-storage.yml, ci-nfe.yml and
    # ci-rules.yml no longer re-run the @delfrance/{schemas,data,auth} suites, so
    # on a main → production PR the `test` job below is the only thing that runs
    # them.
    branches: [master, main, production, 'claude/**', 'feat/**', 'fix/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Five sibling jobs, not five steps of one job.
#
# They used to be one `lint-typecheck-test` job running them in sequence, which
# cost ~13m26s of wall clock while every other lane finished in under 5. The
# steps are independent, so the split takes the critical path down to the
# slowest single job (`test`, ~5m30s).
#
# ⚠️ Splitting is only free because turbo's `^build` edge on lint/typecheck/test
# resolves to ZERO tasks here: no `packages/*`, `packages/integrations/*` or
# `tools/*` workspace defines a `build` script — the libraries export raw
# TypeScript (`"main": "./src/index.ts"`) and nothing depends on an app. Give a
# package a `build` script and each of these jobs starts paying for it
# separately; measure before assuming the split is still free.
#
# There is also no turbo remote cache and no `.turbo` persistence anywhere, so
# every task already ran cold in the single-job form — the split loses no cache
# locality. The five jobs DO share the pnpm-store cache key, and on a lockfile
# change four of them will log "Unable to reserve cache with key ..., another job
# may be creating this cache". That is not an error and not new: the six other
# lanes already share that key namespace concurrently.
#
# ⚠️ None of the five carries an `if:` and the workflow has no `paths:`, so all
# five are unskippable and each is directly pinnable — which is why this file
# needs no `gate` job (see .claude/skills/ci-lanes/SKILL.md). Adding an `if:` to
# any of them would make it skippable, and GitHub counts a `skipped` job as
# SATISFYING a required check. Don't.
#
# ⚠️ The `env:` block and the first six steps are BYTE-IDENTICAL in all five
# jobs, deliberately — that is what lets `diff` prove they have not drifted, the
# same discipline the domain lanes apply to their gate bodies. Every comment
# that used to sit inside them lives here instead, once:
#
#   · FUNCTIONS_REGION — required by the `build` job; the reason is recorded on
#     that job, next to the command that needs it. It is replicated on the other
#     four rather than scoped to `build` because it was a job-level env before
#     the split, so the test suite ran with it set, and `requireRegion`
#     (@delfrance/core/region) THROWS when it is unset. Keeping it everywhere
#     preserves the previous behaviour exactly.
#   · NEXT_TELEMETRY_DISABLED — skips Next.js telemetry and its build-time
#     notice in CI.
#   · `ref: … || github.sha` — the fallback is explicit rather than implicit: on
#     a push or dispatch the PR context is unset, and `actions/checkout` only
#     does the right thing there because it treats the empty string as unset.
#     Same form as every other lane.
#   · `corepack enable` with no version — corepack takes it from `packageManager`
#     in package.json, the single source of truth, and overrides any
#     `corepack prepare` pin.
# ---------------------------------------------------------------------------
jobs:
  typecheck:
    name: CI typecheck
    runs-on: ubuntu-latest
    # Observed 111-118s over 4 runs on 2026-08-24.
    timeout-minutes: 15
    env:
      FUNCTIONS_REGION: us-central1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

  lint:
    name: CI lint
    runs-on: ubuntu-latest
    # Observed 159-174s over 4 runs on 2026-08-24.
    timeout-minutes: 15
    env:
      FUNCTIONS_REGION: us-central1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

  format-check:
    name: CI format check
    runs-on: ubuntu-latest
    # Observed 29-33s over 4 runs on 2026-08-24. `format:check` is a plain
    # root-level `prettier --check .`, not a turbo task, so it cannot be
    # filtered or parallelised further.
    timeout-minutes: 10
    env:
      FUNCTIONS_REGION: us-central1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

  test:
    name: CI test
    runs-on: ubuntu-latest
    # Observed 265-292s over 4 runs on 2026-08-24 — the critical path of this
    # workflow. @delfrance/web alone is ~256s of it (223 test files), so this is
    # the only job worth optimising further.
    timeout-minutes: 25
    env:
      FUNCTIONS_REGION: us-central1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # Every exclusion here is owned by exactly one domain lane, which runs
        # those tests instead. NF-e → ci-nfe.yml (offline + live). Freight
        # (Melhor Envio) → ci-freight.yml (offline + the live sandbox lane, whose
        # *.sandbox.test.ts THROWS in CI without a token — so it must not be
        # collected here). storage/functions → ci-storage.yml (unit + emulator).
        # Mercado Livre → ci-mercado-livre.yml, which runs the unit suite in
        # `ML offline (unit)` and the *.firestore.test.ts suite on the emulator.
        #
        # ⚠️ An exclusion is a promise that the owning lane runs those tests. When
        # the lane skips, they run NOWHERE — which is why every lane derives its
        # scope from the dependency graph and reports through a pinned gate. Do
        # not add a filter here without an owner on the other side.
        #
        # The converse also holds, and is why @delfrance/{schemas,auth,data} are
        # NOT excluded: this workflow has no `paths:` and no `if:`, so it is the
        # one lane that always runs. The domain lanes therefore do not re-run
        # those suites — ci-storage.yml, ci-nfe.yml and ci-rules.yml each say so
        # on their own test step.
        #
        # Lint / typecheck / build are their own jobs and stay full-graph and
        # unfiltered, so cross-package breaks still surface on every PR.
        run: |
          pnpm turbo run test \
            --filter '!@delfrance/nfe-app' \
            --filter '!@delfrance/integrations-nfe' \
            --filter '!@delfrance/melhor-envio-app' \
            --filter '!@delfrance/integrations-freight-br' \
            --filter '!@delfrance/storage' \
            --filter '!@delfrance/functions' \
            --filter '!@delfrance/mercado-livre-app' \
            --filter '!@delfrance/integrations-mercado-livre'

  build:
    name: CI build
    runs-on: ubuntu-latest
    # Observed 136-151s over 4 runs on 2026-08-24.
    timeout-minutes: 20
    # ⚠️ `turbo run build` compiles apps/functions through `node build.mjs` →
    # `requireBuildRegion('FUNCTIONS_REGION')`, which THROWS when it is unset —
    # there is no default. This is the dependency
    # packages/config-eslint/rules/functions-region-supplied.test.js scans for,
    # and the region must match the Storage bucket's.
    env:
      FUNCTIONS_REGION: us-central1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Persist Next.js's incremental build cache across runs for every Next app
      # `turbo run build` compiles (apps/*/.next/cache — non-Next apps have none
      # and are ignored). Keyed on the head SHA (the ref actually built):
      # restore the newest prior cache via restore-keys, save this commit's.
      - name: Cache Next.js builds
        uses: actions/cache@v5
        with:
          path: apps/*/.next/cache
          key: nextjs-ci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            nextjs-ci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm turbo run build


  report-failure:
    name: Post failure logs on PR
    # Quando um dos jobs acima falha num PR, este job puxa o tail dos logs dos
    # jobs que falharam (via API actions:read) e posta como comentário no PR.
    # Substitui o antigo workflow externo post-ci-logs.yml — agora o próprio
    # workflow reporta a falha, sem depender de um workflow_run separado.
    needs: [typecheck, lint, format-check, test, build]
    if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
      # `contents: read` is for the stale-base-hint step's `compare` API call
      # (and the checkout that supplies it) — not for this job's log fetching.
      contents: read
    steps:
      # Checked out ONLY to supply the stale-base-hint composite action. Pinned
      # to the BASE ref, never the PR head: this job holds `pull-requests: write`,
      # so the script it executes has to come from trusted `main` rather than
      # from the branch under test.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch failed job logs
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Lista os jobs deste run que terminaram em falha (este job ainda
          # está em execução, então não aparece como failure).
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > /tmp/failed-jobs.tsv
          if [ ! -s /tmp/failed-jobs.tsv ]; then
            echo "Nenhum job em falha encontrado — nada a reportar."
            # A step `exit 0` no longer ends the job now that commenting is its
            # own step — gate the remaining steps on this output instead.
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          {
            echo "## CI falhou"
            echo
            echo "Workflow \`${{ github.workflow }}\` no commit <code>${HEAD_SHA:0:7}</code> · [ver run completo]($RUN_URL)"
            echo
          } > /tmp/body.md
          while IFS=$'\t' read -r job_id job_name; do
            # tail -c 12000 mantém os últimos ~12KB (onde costuma estar o erro real).
            if ! gh api "repos/$REPO/actions/jobs/$job_id/logs" > "/tmp/job-$job_id.log" 2>/dev/null; then
              echo "(log indisponível — abra o run no GitHub)" > "/tmp/job-$job_id.log"
            fi
            {
              echo "<details>"
              echo "<summary>Job <code>$job_name</code> — últimos 12KB do log</summary>"
              echo
              echo '```'
              tail -c 12000 "/tmp/job-$job_id.log"
              echo
              echo '```'
              echo
              echo "</details>"
              echo
            } >> /tmp/body.md
          done < /tmp/failed-jobs.tsv

      # This lane runs no Playwright specs, so the per-spec culprit match never
      # fires here — what it contributes is the plain "your base is N commits
      # behind" advisory. Reads /tmp/job-*.log, so it runs after the fetch.
      - name: Stale-base hint
        if: ${{ steps.collect.outputs.found == 'true' }}
        uses: ./.github/actions/stale-base-hint
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: ${{ steps.collect.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # O hint vem primeiro — é o que evita alguém investigar uma falha que
          # a própria base já corrigiu. Arquivo vazio quando não há defasagem,
          # deixando o comentário idêntico ao formato anterior. O `touch` garante
          # que um hint pulado ou interrompido nunca quebre o comentário.
          touch /tmp/stale-hint.md
          cat /tmp/stale-hint.md /tmp/body.md > /tmp/comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md
