name: E2E (reusable)

# Shared engine for the themed e2e workflows (e2e-cadastros.yml,
# e2e-vendas.yml). Called via `workflow_call` from a thin `pull_request`
# caller, so it runs from the PR-head definition (it self-tests on the PR that
# introduces it, unlike workflow_run). It first waits for the offline `CI`
# workflow's `lint-typecheck-test` check to pass on the PR head, then builds
# apps/web for production, serves it with `next start` (Playwright's
# webServer), and runs the caller's Playwright projects against staging
# Firebase. Each caller is its own workflow run → its own GITHUB_RUN_ID → a
# distinct Firestore namespace + ephemeral user, so the two themes run
# concurrently without colliding.

on:
  workflow_call:
    inputs:
      projects:
        description: Space-separated Playwright project names to run.
        required: true
        type: string
      slug:
        description: Short theme id used for the report artifact name.
        required: true
        type: string

jobs:
  # Gate: hold until the offline CI (ci.yml's lint-typecheck-test) succeeds on
  # this commit, so e2e only spends staging I/O on PRs that already pass the
  # mandatory offline checks. If offline fails, this job fails → the e2e job
  # below is skipped. Manual workflow_dispatch runs skip the wait.
  await-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for offline CI (lint-typecheck-test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch — skipping the offline gate."
            exit 0
          fi
          echo "Waiting for 'lint-typecheck-test' to conclude on $SHA…"
          for i in $(seq 1 80); do
            resp=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" 2>/dev/null || echo '{}')
            latest=$(printf '%s' "$resp" \
              | jq -c '[.check_runs[]? | select(.name=="lint-typecheck-test")] | sort_by(.started_at) | last // {}')
            status=$(printf '%s' "$latest" | jq -r '.status // ""')
            conclusion=$(printf '%s' "$latest" | jq -r '.conclusion // ""')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Offline CI passed — proceeding to e2e."
                exit 0
              fi
              echo "::error::Offline CI concluded '$conclusion'; gating e2e out."
              exit 1
            fi
            echo "  attempt $i/80 — offline status='${status:-pending}', sleeping 15s"
            sleep 15
          done
          echo "::error::Timed out after ~20 min waiting for offline CI."
          exit 1

  e2e:
    needs: await-offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      # SU credentials for the configuracoes suite (only present in the vendas
      # theme; harmless when the suite isn't selected — its setup self-skips).
      E2E_SU_EMAIL: ${{ secrets.E2E_SU_EMAIL }}
      E2E_SU_PASSWORD: ${{ secrets.E2E_SU_PASSWORD }}
      # Emit client source maps so prod-build stack traces are readable in the
      # Playwright trace. Build-only; real App Hosting deploys leave it unset.
      E2E_SOURCEMAPS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Cache the chromium binary keyed on the lockfile (which pins the exact
      # @playwright/test version), so the key invalidates on a Playwright bump.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @delfrance/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @delfrance/web exec playwright install-deps chromium

      - name: Build web (production)
        # NEXT_PUBLIC_* + E2E_SOURCEMAPS are inlined here. Call next directly to
        # skip the `dotenv -e ../../.env.local` wrapper (absent in CI). No dep
        # pre-build needed — transpilePackages compiles the workspace packages
        # (which export ./src) from source.
        run: pnpm --filter @delfrance/web exec next build

      - name: e2e (web) — ${{ inputs.slug }}
        # Playwright's webServer runs PLAYWRIGHT_WEB_CMD (next start) and waits
        # for :3000 before the suites — a precompiled prod server, no cold
        # compile, so workers don't race the compiler.
        env:
          PLAYWRIGHT_WEB_CMD: pnpm exec next start --port 3000
        run: |
          args=""
          for p in ${{ inputs.projects }}; do args="$args --project=$p"; done
          pnpm --filter @delfrance/web exec playwright test $args

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.slug }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment failure log on PR
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -uo pipefail
          gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > /tmp/failed-jobs.tsv || true
          {
            echo "## E2E falhou — e2e ($SLUG)"
            echo
            echo "Commit <code>${HEAD_SHA:0:7}</code> · [ver run completo]($RUN_URL)"
            echo
          } > /tmp/body.md
          if [ -s /tmp/failed-jobs.tsv ]; then
            while IFS=$'\t' read -r job_id job_name; do
              gh api "repos/$REPO/actions/jobs/$job_id/logs" > "/tmp/job-$job_id.log" 2>/dev/null \
                || echo "(log indisponível — abra o run no GitHub)" > "/tmp/job-$job_id.log"
              {
                echo "<details>"
                echo "<summary>Job <code>$job_name</code> — últimos 12KB do log</summary>"
                echo
                echo '```'
                tail -c 12000 "/tmp/job-$job_id.log"
                echo
                echo '```'
                echo
                echo "</details>"
                echo
              } >> /tmp/body.md
            done < /tmp/failed-jobs.tsv
          fi
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/body.md || true
