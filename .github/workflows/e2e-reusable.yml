name: E2E (reusable)

# Shared engine for the themed e2e workflows (e2e-cadastros.yml,
# e2e-vendas.yml). Called via `workflow_call` from a thin `pull_request`
# caller, so it runs from the PR-head definition (it self-tests on the PR that
# introduces it, unlike workflow_run). It builds apps/web for production,
# serves it with `next start` (Playwright's webServer), and runs the caller's
# Playwright projects against staging Firebase — running concurrently with the
# offline `CI` workflow, not gated on it. Each caller is its own workflow run →
# its own GITHUB_RUN_ID → a distinct Firestore namespace + ephemeral user, so
# the two themes run concurrently without colliding.
#
# ⚠️ That last sentence stops holding the moment a caller runs this workflow
# MORE THAN ONCE (sharding). Two such jobs share GITHUB_RUN_ID, GITHUB_WORKFLOW
# and GITHUB_REF — which is every input the fixture-isolation keys are built
# from — so they would sweep each other's LIVE fixtures and delete each other's
# ephemeral auth user. `run_slot` is what restores the invariant; see the
# `e2eRunSlot` docblock in tools/test-fixtures/src/admin.ts for the three axes
# it scopes. A sharded caller MUST pass a distinct `run_slot` per job.

on:
  workflow_call:
    inputs:
      projects:
        description: Space-separated Playwright project names to run.
        required: true
        type: string
      slug:
        description: Short theme id used for the report artifact name.
        required: true
        type: string
      shard:
        description: >-
          Playwright `--shard=i/N` for a lane split across several jobs. Empty
          (the default) runs the whole selection in one job. Safe here because
          Playwright distributes whole test GROUPS and never splits one, and
          every spec in these lanes is `test.describe.serial` — so a shard
          boundary always falls between files, never inside a serial block.
          ⚠️ It balances by TEST COUNT, not duration.
        required: false
        default: ''
        type: string
      run_slot:
        description: >-
          Digits identifying this job among a sharded caller's jobs, exported as
          E2E_RUN_SLOT. ⚠️ REQUIRED whenever `shard` is set, and it must differ
          per job: it is the only thing keeping two jobs of ONE workflow run from
          sharing every fixture-isolation key and deleting each other's live
          fixtures mid-suite. Empty for an unsharded lane, which then behaves
          byte-identically to before.
        required: false
        default: ''
        type: string
      workers:
        description: >-
          Playwright worker processes, as PLAYWRIGHT_WORKERS. Defaults to the
          config's own CI value. The runner is 4 vCPU but these suites are
          network-bound on staging Firebase, so the ceiling is not obviously 4 —
          raise it per lane only with a measured before/after on BOTH wall clock
          and the retry-rescued count.
        required: false
        default: ''
        type: string
      integrations:
        description: >-
          Also build and serve apps/integrations on :3001. Needed by suites that
          drive the admin endpoints (POST /api/admin/users and .../claims) —
          those route handlers live in that app, NOT in apps/web, which has no
          route handlers at all. Only the vendas lane needs it today.
        required: false
        default: false
        type: boolean

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Run inside Playwright's official image: Chromium and all of its system
    # deps are pre-baked, so there's no per-run `playwright install-deps` (apt)
    # cost — the previous bottleneck. Pin the tag to the @playwright/test version
    # in pnpm-lock.yaml; `-noble` is Ubuntu 24.04, matching ubuntu-latest.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      # Chromium in a container gets Docker's tiny default /dev/shm (64 MB),
      # which can crash tabs mid-run. Share the host IPC namespace so it uses
      # the runner's full shared memory — Playwright's recommended container
      # setting for CI stability.
      options: --ipc=host
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Job-level on purpose: the `always()` reclaim step below invokes
      # global-teardown.ts DIRECTLY, and it must resolve the same slot as the
      # suite or it sweeps a prefix nothing seeded (leaking this job's fixtures)
      # or, worse, one a sibling shard is still using.
      E2E_RUN_SLOT: ${{ inputs.run_slot }}
      PLAYWRIGHT_WORKERS: ${{ inputs.workers }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      # SU credentials for the configuracoes suite (only present in the vendas
      # theme; harmless when the suite isn't selected — its setup self-skips).
      E2E_SU_EMAIL: ${{ secrets.E2E_SU_EMAIL }}
      E2E_SU_PASSWORD: ${{ secrets.E2E_SU_PASSWORD }}
      # Where apps/web's admin HTTP client points. Next INLINES NEXT_PUBLIC_* at
      # build time, so this has to be set for the build below, not just at test
      # time. Deliberately unconditional: both lanes then produce an identical
      # web build, so the `nextjs-web-e2e-*` cache they share can't hand one lane
      # a build carrying the other's inlined value. ⚠️ That key is now shared
      # ACROSS COMMITS too (the head SHA came out of it), so this must stay
      # unconditional — a lane-conditional NEXT_PUBLIC_* would now poison the
      # cache for every later run, not just for a concurrent sibling. Inert
      # without `integrations: true` — no cadastros spec calls the admin
      # endpoints.
      NEXT_PUBLIC_INTEGRATIONS_URL: http://localhost:3001
      # ⚠️ REQUIRED, and deliberately NOT `us-central1` like every other lane.
      #
      # This is the one lane that calls REAL callables on REAL staging
      # (`reconciliarPagamentoPedido` from the Pagamentos tab), so the value must
      # name the region staging's functions are ACTUALLY deployed to — today
      # us-east1, the region the deleted `client.ts` fallback happened to name.
      # Every other workflow runs against an emulator, where the region is
      # arbitrary as long as both halves agree; here it is a fact about deployed
      # infrastructure that no PR can change.
      #
      # It moves to us-central1 when the functions themselves do, in the migration
      # window (ADR 0013 / #1115) — not before, or the callable targets a region
      # where it does not exist. Until then a mismatch is what it was in the run
      # that added this line: the pedido never leaves `iniciado`, because the
      # reconcile never fires.
      #
      # Unconditional, like NEXT_PUBLIC_INTEGRATIONS_URL above and for the same
      # reason: both lanes must produce an identical web build or the shared
      # `nextjs-web-e2e-*` cache can hand one lane the other's inlined value.
      NEXT_PUBLIC_FUNCTIONS_REGION: us-east1
      # Emit client source maps so prod-build stack traces are readable in the
      # Playwright trace. Build-only; real App Hosting deploys leave it unset.
      E2E_SOURCEMAPS: 'true'
      # Skip Next.js telemetry collection + its build-time notice in CI.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # `id` so the always()-teardown below can tell "the suite ran and left
      # fixtures behind" from "the runner never got a working checkout".
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Browsers + their system deps are baked into the Playwright image, pinned
      # to the @playwright/test version. This is a no-op when the image tag
      # matches the lockfile; it only re-fetches the browser if a Playwright bump
      # outruns the tag. When upgrading @playwright/test, bump the
      # `container.image` tag above to match.
      - name: Ensure Chromium matches the lockfile
        run: pnpm --filter @delfrance/web exec playwright install chromium

      # Persist Next.js's incremental build cache between runs so `next build`
      # isn't cold every time. `-e2e-` keeps this distinct from ci.yml's web
      # build (this one emits source maps).
      #
      # ⚠️ The key deliberately does NOT carry the head SHA any more. It used to,
      # so that each run saved "this commit's" cache — but `actions/cache` only
      # skips the save on an EXACT key hit, so a per-commit key meant every run of
      # every lane wrote a fresh ~350 MB entry that only its own PR could ever
      # read back (Actions scopes a cache to its branch plus the default branch,
      # and these lanes have no `push:` trigger, so no `main`-scoped entry exists
      # to restore from either). Measured 2026-08-27: 58 live `nextjs-web-e2e-*`
      # entries, the repo pinned at 9.97 GB of its 10 GB ceiling, LRU evicting the
      # pnpm store — which is why `pnpm-store-*` then missed its own exact key and
      # re-saved too, for 35–49 s of `Post Run actions/cache` on every job
      # measured, spent AFTER the tests had already finished.
      #
      # Without the SHA, run 2+ of a branch hits the exact key and saves nothing.
      # The trade is a build cache frozen at the branch's first run for a given
      # lockfile; Next's cache is content-hash-keyed internally, so a stale entry
      # degrades to a miss per changed module rather than to a wrong build.
      - name: Cache Next.js build (web)
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: nextjs-web-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-web-e2e-${{ runner.os }}-

      - name: Build web (production)
        # NEXT_PUBLIC_* + E2E_SOURCEMAPS are inlined here. Call next directly to
        # skip the `dotenv -e ../../.env.local` wrapper (absent in CI). No dep
        # pre-build needed — transpilePackages compiles the workspace packages
        # (which export ./src) from source.
        run: pnpm --filter @delfrance/web exec next build

      - name: Build integrations (production)
        if: ${{ inputs.integrations }}
        # Same `next`-directly rationale as the web build above: the package
        # script wraps it in `dotenv -e ../../.env.local`, which doesn't exist
        # in CI. The admin routes are force-dynamic, so they read
        # FIREBASE_PROJECT_ID / FIREBASE_SERVICE_ACCOUNT at request time from
        # the job env — nothing extra to inject at build time.
        run: pnpm --filter @delfrance/integrations-app exec next build

      - name: e2e (web) — ${{ inputs.slug }}
        # Playwright's webServer runs PLAYWRIGHT_WEB_CMD (next start) and waits
        # for :3000 before the suites — a precompiled prod server, no cold
        # compile, so workers don't race the compiler. With `integrations: true`
        # it brings up a second server on :3001 the same way; an empty value
        # leaves that entry out of the webServer list entirely.
        env:
          PLAYWRIGHT_WEB_CMD: pnpm exec next start --port 3000
          PLAYWRIGHT_INTEGRATIONS_CMD: >-
            ${{ inputs.integrations
            && 'pnpm --filter @delfrance/integrations-app exec next start --port 3001'
            || '' }}
          # `next start` runs with NODE_ENV=production, and since #821/T5 the
          # backends' CORS allow-list is EXACTLY this variable in production —
          # localhost is only implicit outside it. Unset, the :3001 admin routes
          # would allow no origin at all and every browser call from :3000 would
          # fail CORS (configuracoes.spec.ts hangs to a 60s timeout, which is
          # precisely how this was found). CI serves a production build to a
          # localhost browser, so like any real deploy it must declare its
          # origins. Harmless on the lanes that start no :3001 server.
          ALLOWED_ADMIN_ORIGINS: http://localhost:3000
        run: |
          args=""
          for p in ${{ inputs.projects }}; do args="$args --project=$p"; done
          if [ -n "${{ inputs.shard }}" ]; then args="$args --shard=${{ inputs.shard }}"; fi
          echo "playwright test$args"
          pnpm --filter @delfrance/web exec playwright test $args

      # Playwright's own globalTeardown does NOT run when the job is cancelled,
      # and every e2e workflow sets `cancel-in-progress: true` — so each push to
      # a PR killed the in-flight run mid-suite and permanently orphaned its
      # fixtures in staging (#712). `always()` covers cancellation, which is the
      # only case that ever leaked. Idempotent with the in-process teardown: on a
      # normal run this finds its own prefix already swept and does nothing.
      #
      # `exec tsx` rather than the `teardown:e2e` script, which wraps itself in
      # `dotenv -e ../../.env.local` for local use — in CI the credentials are
      # already in the job env and there is no such file.
      #
      # Gated on the install having SUCCEEDED, not just on `always()`. A run that
      # died during `pnpm install` (registry timeouts are routine) never seeded a
      # fixture, so there is nothing to reclaim — and `pnpm exec` would re-enter
      # the very install that just failed, burn the timeout, and report a second
      # error on top of the real one. Cancellation, the case this step exists
      # for, always has a successful install behind it.
      - name: Reclaim e2e fixtures — ${{ inputs.slug }}
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm --filter @delfrance/web exec tsx e2e/global-teardown.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.slug }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Separate job (not a step in `e2e`) so it starts only AFTER e2e concludes:
  # a step inside e2e would see its own job still `in_progress` (conclusion
  # null), so the `conclusion == "failure"` filter would match nothing and the
  # log tail would be empty. As a downstream job, the failed e2e job has
  # concluded and its logs are fetchable. Mirrors ci.yml's report-failure.
  # `needs.e2e.result == 'failure'` fires only when e2e actually ran and
  # failed (e.g. not on cancellation).
  report-failure:
    needs: [e2e]
    if: ${{ always() && needs.e2e.result == 'failure' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # Checked out ONLY to supply the stale-base-hint composite action. Pinned
      # to the BASE ref, never the PR head: this job holds `pull-requests: write`,
      # so the script it executes has to come from trusted `main` rather than
      # from the branch under test.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Collect failure log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -uo pipefail
          gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > /tmp/failed-jobs.tsv || true
          {
            echo "## E2E falhou — e2e ($SLUG)"
            echo
            echo "Commit <code>${HEAD_SHA:0:7}</code> · [ver run completo]($RUN_URL)"
            echo
          } > /tmp/body.md
          if [ -s /tmp/failed-jobs.tsv ]; then
            while IFS=$'\t' read -r job_id job_name; do
              gh api "repos/$REPO/actions/jobs/$job_id/logs" > "/tmp/job-$job_id.log" 2>/dev/null \
                || echo "(log indisponível — abra o run no GitHub)" > "/tmp/job-$job_id.log"
              {
                echo "<details>"
                echo "<summary>Job <code>$job_name</code> — últimos 12KB do log</summary>"
                echo
                echo '```'
                tail -c 12000 "/tmp/job-$job_id.log"
                echo
                echo '```'
                echo
                echo "</details>"
                echo
              } >> /tmp/body.md
            done < /tmp/failed-jobs.tsv
          fi

      # Reads the /tmp/job-*.log files written above, so it must run after them.
      - name: Stale-base hint
        uses: ./.github/actions/stale-base-hint
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment failure log on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # The hint leads — it is the thing that stops someone reading a trace
          # for a failure their base already fixed. Empty file when not stale,
          # leaving the comment byte-identical to before. `touch` so a skipped
          # or half-run hint step can never break the comment.
          touch /tmp/stale-hint.md
          cat /tmp/stale-hint.md /tmp/body.md > /tmp/comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md || true
