name: CI — Storage

# Dedicated storage pipeline. Runs only when the storage helpers, the Cloud
# Functions, or their config change. The headline `ci.yml` excludes
# `@delfrance/storage` + `@delfrance/functions` from its turbo `test` filter to
# avoid double-running; lint / typecheck / build there still cover the full
# graph.
on:
  push:
    branches: [master, main]
    paths:
      - 'packages/storage/**'
      - 'apps/functions/**'
      - 'packages/schemas/src/storage/arquivo.ts'
      - 'packages/schemas/src/storage/storagePaths.ts'
      - 'packages/schemas/src/storage/foto.ts'
      - 'packages/data/src/admin/collections/arquivoCollection.ts'
      - 'packages/data/src/admin/collections/produtoCollection.ts'
      # The pedido estado reconcile + everything its emulator suite exercises: the
      # transition rule table (`nextPedidoEstado`), the paying-status/sum rule
      # (`sumPagamentosPagos`) and the frete-estado allow-list that decides dispatch
      # authorization (`ESTADOS_FRETE_PRE_AUTORIZACAO`, #702) all live outside this
      # file, so editing any one alone would otherwise skip the only test that runs
      # the real Admin-SDK transaction.
      - 'packages/data/src/admin/pedidoReconcile*.ts'
      - 'packages/data/src/pedido/usecases.ts'
      # A GLOB, deliberately, in place of the single `pagamento.ts` it replaces.
      # Every pedido subcollection the emulator suite parses through belongs here
      # (pagamento, plus the two trigger-written audit trails), and a named-file
      # list rots the moment one is added or renamed: `ci.yml` excludes
      # @delfrance/functions from its turbo `test` filter, so a schema edit that
      # matches nothing here runs in NO lane — the check reports *skipped*, never
      # failed. This repo has already shipped that bug twice (ci-freight, ci-nfe).
      # An over-broad filter costs runner minutes; a stale one costs coverage
      # silently, so the glob wins.
      - 'packages/schemas/src/pedido/collection/**'
      - 'packages/data/src/admin/collections/historicoEstadoPedidoCollection.ts'
      - 'packages/data/src/admin/collections/historicoFreteInicialCollection.ts'
      - 'packages/schemas/src/shared/frete.ts'
      - 'storage.rules'
      - 'cors.json'
      - 'firebase.functions.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-storage.yml'
  pull_request:
    # The prefix entries cover stacked PRs — see ci.yml.
    branches: [master, main, 'claude/**', 'feat/**', 'fix/**']
    paths:
      - 'packages/storage/**'
      - 'apps/functions/**'
      - 'packages/schemas/src/storage/arquivo.ts'
      - 'packages/schemas/src/storage/storagePaths.ts'
      - 'packages/schemas/src/storage/foto.ts'
      - 'packages/data/src/admin/collections/arquivoCollection.ts'
      - 'packages/data/src/admin/collections/produtoCollection.ts'
      # The pedido estado reconcile + everything its emulator suite exercises: the
      # transition rule table (`nextPedidoEstado`), the paying-status/sum rule
      # (`sumPagamentosPagos`) and the frete-estado allow-list that decides dispatch
      # authorization (`ESTADOS_FRETE_PRE_AUTORIZACAO`, #702) all live outside this
      # file, so editing any one alone would otherwise skip the only test that runs
      # the real Admin-SDK transaction.
      - 'packages/data/src/admin/pedidoReconcile*.ts'
      - 'packages/data/src/pedido/usecases.ts'
      # A GLOB, deliberately, in place of the single `pagamento.ts` it replaces.
      # Every pedido subcollection the emulator suite parses through belongs here
      # (pagamento, plus the two trigger-written audit trails), and a named-file
      # list rots the moment one is added or renamed: `ci.yml` excludes
      # @delfrance/functions from its turbo `test` filter, so a schema edit that
      # matches nothing here runs in NO lane — the check reports *skipped*, never
      # failed. This repo has already shipped that bug twice (ci-freight, ci-nfe).
      # An over-broad filter costs runner minutes; a stale one costs coverage
      # silently, so the glob wins.
      - 'packages/schemas/src/pedido/collection/**'
      - 'packages/data/src/admin/collections/historicoEstadoPedidoCollection.ts'
      - 'packages/data/src/admin/collections/historicoFreteInicialCollection.ts'
      - 'packages/schemas/src/shared/frete.ts'
      - 'storage.rules'
      - 'cors.json'
      - 'firebase.functions.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-storage.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-build-test:
    name: Lint / typecheck / unit / build (offline)
    runs-on: ubuntu-latest
    # Inlined into the functions bundle at build time (build.mjs); the build
    # fails without it. Must match the Storage bucket region.
    env:
      FUNCTIONS_REGION: us-east1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm turbo run lint \
            --filter @delfrance/storage \
            --filter @delfrance/functions \
            --filter @delfrance/schemas \
            --filter @delfrance/data

      - name: Typecheck
        run: |
          pnpm turbo run typecheck \
            --filter @delfrance/storage \
            --filter @delfrance/functions \
            --filter @delfrance/schemas \
            --filter @delfrance/data

      - name: Unit tests (offline — excludes *.storage.test.ts)
        run: |
          pnpm turbo run test \
            --filter @delfrance/storage \
            --filter @delfrance/functions \
            --filter @delfrance/schemas \
            --filter @delfrance/data

      - name: Build functions bundle
        run: pnpm --filter @delfrance/functions build

  storage-emulator:
    name: Emulator integration (firestore + storage + functions)
    runs-on: ubuntu-latest
    needs: storage-build-test
    # Inlined into the functions bundle at build time (build.mjs).
    env:
      FUNCTIONS_REGION: us-east1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The Firebase Emulator Suite (firestore + storage) runs on the JVM.
      # firebase-tools >= 15 requires JDK 21+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install firebase-tools (pinned)
        run: npm i -g firebase-tools@15.15.0

      - name: Build functions bundle
        run: pnpm --filter @delfrance/functions build

      - name: Run storage suite on the emulators
        # Demo-project mode → no real credentials, nothing touches staging. The
        # functions emulator fires the Storage trigger; the *.storage.test.ts
        # suite asserts the resize round-trip. The function region resolves from
        # the FUNCTIONS_REGION param default (us-east1) — no env needed here.
        run: |
          firebase emulators:exec \
            --config firebase.functions.json \
            --project demo-erp \
            --only firestore,storage,functions \
            "pnpm --filter @delfrance/functions test:storage"

  report-failure:
    name: Post failure note on PR
    needs: [storage-build-test, storage-emulator]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment failure summary
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const body =
              `❌ \`ci-storage.yml\` failed on this PR.\n\n` +
              `See the Actions tab for full logs: ` +
              `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber, body,
            });
