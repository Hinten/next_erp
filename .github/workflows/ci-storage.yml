name: CI — Storage

# Dedicated storage pipeline. Runs only when the storage helpers, the Cloud
# Functions, or their config change. The headline `ci.yml` excludes
# `@delfrance/storage` + `@delfrance/functions` from its turbo `test` filter to
# avoid double-running; lint / typecheck / build there still cover the full
# graph.
on:
  push:
    branches: [master, main]
    paths:
      - 'packages/storage/**'
      - 'apps/functions/**'
      - 'packages/schemas/src/storage/arquivo.ts'
      - 'packages/schemas/src/storage/storagePaths.ts'
      - 'packages/schemas/src/storage/foto.ts'
      - 'packages/data/src/admin/collections/arquivoCollection.ts'
      - 'packages/data/src/admin/collections/produtoCollection.ts'
      # The pedido estado reconcile + everything its emulator suite exercises: the
      # transition rule table (`nextPedidoEstado`), the paying-status/sum rule
      # (`sumPagamentosPagos`) and the frete-estado allow-list that decides dispatch
      # authorization (`ESTADOS_FRETE_PRE_AUTORIZACAO`, #702) all live outside this
      # file, so editing any one alone would otherwise skip the only test that runs
      # the real Admin-SDK transaction.
      - 'packages/data/src/admin/pedidoReconcile*.ts'
      - 'packages/data/src/pedido/usecases.ts'
      # A GLOB, deliberately, in place of the single `pagamento.ts` it replaces.
      # Every pedido subcollection the emulator suite parses through belongs here
      # (pagamento, plus the two trigger-written audit trails), and a named-file
      # list rots the moment one is added or renamed: `ci.yml` excludes
      # @delfrance/functions from its turbo `test` filter, so a schema edit that
      # matches nothing here runs in NO lane — the check reports *skipped*, never
      # failed. This repo has already shipped that bug twice (ci-freight, ci-nfe).
      # An over-broad filter costs runner minutes; a stale one costs coverage
      # silently, so the glob wins.
      - 'packages/schemas/src/pedido/collection/**'
      - 'packages/data/src/admin/collections/historicoFreteInicialCollection.ts'
      - 'packages/schemas/src/shared/frete.ts'
      # `onPedidoChanged` writes the estado audit trail THROUGH these two
      # (`historicoEstadoPedidoCollection.parse`), and since #697 they are the
      # only place the row shape is asserted — the always-on assertion that used
      # to live in `@delfrance/data` went away with the client-side writer, and
      # `ci.yml` excludes `@delfrance/functions` from its test filter. Without
      # these entries a PR editing only the schema runs no test that reads the
      # trail's fields at all.
      - 'packages/schemas/src/pedido/collection/historicoEstadoPedido.ts'
      - 'packages/data/src/admin/collections/historicoEstadoPedidoCollection.ts'
      - 'storage.rules'
      # `cors.json` was here but no step in this repo reads it — grep finds it only
      # in this file and one ADR sentence. It cost a full lane run and validated
      # nothing, so it is gone from the push trigger.
      - 'firebase.functions.json'
      - 'firestore.indexes.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-storage.yml'
  pull_request:
    # The prefix entries cover stacked PRs — see ci.yml. `production` is the
    # release base (main → production); without it this lane reports no check at
    # all on the PR that actually ships.
    branches: [master, main, production, 'claude/**', 'feat/**', 'fix/**']
    # ⚠️ NO `paths:` here, deliberately — a non-matching `paths:` publishes NO
    # check run at all, so nothing can be pinned to this lane. Scope lives in the
    # `changes` job below, derived from the dependency graph. The list this
    # replaces named seven individual files under packages/{data,schemas} and so
    # missed the rest of both, plus packages/{auth,core} entirely — and `ci.yml`
    # excludes @delfrance/storage and @delfrance/functions from `turbo run test`,
    # so on a data-only PR their tests ran NOWHERE.
    #
    # `push:` keeps its `paths:`; see the note in ci-nfe.yml. Two entries were
    # dropped from it: `cors.json` (read by no step in this repo) and the
    # duplicated historicoEstadoPedidoCollection.ts line.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ~20s. Reads the workspace manifests and asks whether anything this lane
  # actually depends on changed. No `pnpm install` — plain Node reading
  # package.json files.
  changes:
    name: CI scope (storage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_e2e: ${{ steps.decide.outputs.run_e2e || steps.collect.outputs.run_e2e }}
      reason: ${{ steps.decide.outputs.reason || steps.collect.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Collect the changed paths
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          FILES="$RUNNER_TEMP/changed-files.txt"
          : > "$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          decided() {
            {
              echo "decided=true"
              echo "run_e2e=true"
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            echo "run_e2e=true :: $1"
          }

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            decided "event is \`$GITHUB_EVENT_NAME\`, not a pull request — running the lane."
            exit 0
          fi

          if ! gh api "repos/$REPO/pulls/$PR/files" --paginate \
                 --jq '.[] | .filename, (.previous_filename // empty)' > "$FILES"
          then
            decided "could not list the PR's files — running the lane (fail safe)."
            exit 0
          fi

          n=$(wc -l < "$FILES" | tr -d ' ')
          if [ "$n" -ge 3000 ]; then
            decided "the API returned $n path(s) — truncated. Running the lane (fail safe)."
            exit 0
          fi
          echo "Collected $n changed path(s)."

      - name: Decide whether this lane must run
        id: decide
        if: steps.collect.outputs.decided != 'true'
        # ⚠️ The `if !` fallback is load-bearing, not defensive noise. This YAML comes
        # from the merge ref while the checkout above is the PR head, so on a branch
        # older than the script node exits 1 (`Cannot find module`) before the
        # script's own fail-safe can fire — killing `changes` and reddening a gate
        # that only a rebase could clear. Degrade to RUNNING the lane. See the
        # VERSION SKEW note in e2e-affected.mjs; enforced by ci-lane-gates.test.js.
        run: |
          if ! node .github/scripts/e2e-affected.mjs \
                 --kind CI \
                 --lane storage \
                 --roots @delfrance/storage @delfrance/functions \
                 --self .github/workflows/ci-storage.yml \
                 --files "${{ steps.collect.outputs.files }}"
          then
            {
              echo "run_e2e=true"
              echo "reason=the scope script could not run at this PR's head commit — it is older than the workflow invoking it. Running the lane (fail safe). Merge \`main\` into this branch for a real scope decision."
            } >> "$GITHUB_OUTPUT"
            echo "::warning title=CI scope (storage)::the scope script is missing from this PR's head commit — running the lane (fail safe). Merge main into the branch."
          fi

  storage-build-test:
    name: Storage offline (lint + typecheck + unit + build)
    needs: [changes]
    if: ${{ needs.changes.outputs.run_e2e == 'true' }}
    # Observed max across 15 successful runs: 2.4 min.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Inlined into the functions bundle at build time (build.mjs); the build
    # fails without it. Must match the Storage bucket region.
    env:
      FUNCTIONS_REGION: us-east5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm turbo run lint \
            --filter @delfrance/storage \
            --filter @delfrance/functions \
            --filter @delfrance/schemas \
            --filter @delfrance/data

      - name: Typecheck
        run: |
          pnpm turbo run typecheck \
            --filter @delfrance/storage \
            --filter @delfrance/functions \
            --filter @delfrance/schemas \
            --filter @delfrance/data

      - name: Unit tests (offline — excludes *.storage.test.ts)
        # Only the two workspaces `ci.yml` EXCLUDES from its own `turbo run test`.
        # `@delfrance/schemas` and `@delfrance/data` used to be listed here as well,
        # which re-ran on the same commit tests ci.yml had already run: turbo's
        # `test` task declares `dependsOn: ["^build"]`, not `^test`, and no remote
        # cache is configured, so it was genuine duplicate execution.
        run: |
          pnpm turbo run test \
            --filter @delfrance/storage \
            --filter @delfrance/functions

      - name: Build functions bundle
        run: pnpm --filter @delfrance/functions build

  storage-emulator:
    name: Storage emulator (firestore + storage + functions)
    runs-on: ubuntu-latest
    # Observed max across 15 successful runs: 3.9 min.
    timeout-minutes: 25
    needs: [changes, storage-build-test]
    # Inlined into the functions bundle at build time (build.mjs).
    env:
      FUNCTIONS_REGION: us-east5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The Firebase Emulator Suite (firestore + storage) runs on the JVM.
      # firebase-tools >= 15 requires JDK 21+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install firebase-tools (pinned)
        run: npm i -g firebase-tools@15.15.0

      - name: Build functions bundle
        run: pnpm --filter @delfrance/functions build

      - name: Run storage suite on the emulators
        # Demo-project mode → no real credentials, nothing touches staging. The
        # functions emulator fires the Storage trigger; the *.storage.test.ts
        # suite asserts the resize round-trip. The function region resolves from
        # the FUNCTIONS_REGION param default (us-east5) — no env needed here.
        run: |
          firebase emulators:exec \
            --config firebase.functions.json \
            --project demo-erp \
            --only firestore,storage,functions \
            "pnpm --filter @delfrance/functions test:storage"

  report-failure:
    # Renamed: three lanes published a check literally named `Post failure note on
    # PR`, which a check-run name's lack of workflow prefix made indistinguishable.
    name: Storage failure note
    needs: [changes, storage-build-test, storage-emulator]
    # Fork guard added: this job holds `pull-requests: write`, which a fork run's
    # read-only token cannot exercise — it would 403 and mask the real failure.
    if: >-
      ${{ failure() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment failure summary
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const body =
              `❌ \`ci-storage.yml\` failed on this PR.\n\n` +
              `See the Actions tab for full logs: ` +
              `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber, body,
            });

  # THE pinnable check for this lane. Everything above can legitimately be
  # skipped; this cannot.
  #
  # ⚠️ `if: always()` and NOTHING else, on purpose. A job skipped by `if:` still
  # publishes a check run, with conclusion `skipped`, and GitHub's required-
  # status-check evaluation treats `skipped` as SATISFYING the requirement. A gate
  # carrying any other condition would go green in exactly the cases it exists to
  # report on. Do not add one.
  #
  # ⚠️ `needs:` lists the CERTIFIABLE jobs only. The report-* jobs are `skipped` on
  # every green run, so needing them would make this gate permanently red.
  gate:
    name: CI gate (storage)
    needs: [changes, storage-build-test, storage-emulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LANE: CI gate (storage)
          SCOPE_JOB: CI scope (storage)
          PR: ${{ github.event.pull_request.number }}

          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_LANE: ${{ needs.changes.outputs.run_e2e }}
          REASON: ${{ needs.changes.outputs.reason }}

          # --- recorded guards. ONLY these can excuse a skip. ------------------
          GUARD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          GUARD_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}

          # --- per-job results -------------------------------------------------
          RESULT_OFFLINE: ${{ needs.storage-build-test.result }}
          RESULT_EMULATOR: ${{ needs.storage-emulator.result }}

          # --- the manifest. One row per certified job:
          #       <result env var>|required|optional:<guard>[+<guard>]|<published check-run name>
          #     The check-run name must match the job's `name:` byte for byte — it
          #     is how the anti-vacuity lock finds the job in the jobs API.
          JOBS: |
            RESULT_OFFLINE|required|Storage offline (lint + typecheck + unit + build)
            RESULT_EMULATOR|required|Storage emulator (firestore + storage + functions)
        run: |
          set -uo pipefail
          ROWS="$RUNNER_TEMP/gate-rows.md";        : > "$ROWS"
          NOTES="$RUNNER_TEMP/gate-notes.md";      : > "$NOTES"
          CERTIFY="$RUNNER_TEMP/gate-certify.txt"; : > "$CERTIFY"

          row()  { printf '| `%s` | `%s` | %s |\n' "$1" "$2" "$3" >> "$ROWS"; }
          note() { printf '%s\n\n' "$1" >> "$NOTES"; }

          report() {
            {
              echo "### $LANE — $1"
              echo
              echo "$2"
              echo
              echo "| check run | result | verdict |"
              echo "| --- | --- | --- |"
              cat "$ROWS"
              echo
              echo "Scope (\`$SCOPE_JOB\`): \`run=${RUN_LANE:-<empty>}\` — ${REASON:-<none recorded>}"
              echo
              cat "$NOTES"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          fail() { report "NOT verified" "$1"; echo "::error title=$LANE::$1";  exit 1; }
          # Mirror a PASS into the log too: otherwise a green gate is visible only
          # in the step summary, which is not part of what the failure reporters
          # collect, so a green gate could never be audited from the logs.
          pass() { report "verified"     "$1"; echo "::notice title=$LANE::$1"; exit 0; }

          # (1) The decider must have concluded. "We do not know" is never green.
          [ "$CHANGES_RESULT" = "success" ] || \
            fail "The scope job concluded \`$CHANGES_RESULT\`, so nothing decided whether this lane had to run."

          # (2) ...and it must have produced a verdict.
          case "$RUN_LANE" in
            true|false) : ;;
            *) fail "The scope job produced no verdict (\`run=${RUN_LANE:-<empty>}\`)." ;;
          esac

          # explain_skip <guard-spec>: 0 + sets WHY when a RECORDED input accounts
          # for the skip, 1 otherwise. This is the whole trick — the gate re-derives
          # the predicate that should have caused the skip instead of trusting the
          # job's declared class. An `if:` clause nobody taught this function about
          # matches no guard, so the skip goes RED.
          explain_skip() {
            WHY=""
            if [ "$GUARD_DISPATCH" = "true" ]; then return 1; fi
            local g
            local IFS='+'
            for g in $1; do
              case "$g" in
                not_fork)
                  if [ "${GUARD_FORK:-}" = "true" ]; then
                    WHY="this PR comes from a fork, and fork PRs cannot read repo secrets. A maintainer can verify from an in-repo branch: \`gh pr checkout $PR && git push origin HEAD:fix/pr-$PR-verify\`."
                    return 0
                  fi ;;
                *) return 1 ;;
              esac
            done
            return 1
          }

          # (3) Walk the manifest.
          #     `done <<< "$JOBS"` is a HERESTRING, not a pipe: a pipe would run the
          #     loop in a subshell and every RED/BROKEN assignment would be
          #     discarded, making this gate unconditionally green.
          RED=""; BROKEN=""
          while IFS='|' read -r var class check; do
            case "${var:-}" in ''|'#'*) continue ;; esac
            result="${!var:-}"

            case "$class" in
              required)   guards='' ;;
              optional:*) guards="${class#optional:}" ;;
              *) fail "Gate manifest error: \`$check\` declares an unknown class \`$class\`. Refusing to certify a lane whose own manifest this gate cannot parse." ;;
            esac

            case "$result" in
              success)
                printf '%s\n' "$check" >> "$CERTIFY"
                row "$check" "$result" "ran and passed"
                ;;
              skipped)
                if [ -n "$BROKEN" ]; then
                  row "$check" "$result" "not reached — \`$BROKEN\` did not succeed"
                elif [ "$RUN_LANE" = "false" ]; then
                  row "$check" "$result" "not required — nothing this lane depends on changed"
                elif [ -n "$guards" ] && explain_skip "$guards"; then
                  row "$check" "$result" "**DID NOT RUN** — $WHY"
                  note "**\`$check\` did not run on this PR** — $WHY"
                  echo "::warning title=$LANE::\`$check\` did not run — $WHY"
                else
                  row "$check" "$result" "**UNEXPLAINED SKIP**"
                  RED="${RED}\`$check\` was skipped and this gate cannot explain why: the lane is in scope and no recorded guard (${guards:-none, this job is required}) accounts for it. Someone added an \`if:\` without teaching the gate about it. "
                fi
                ;;
              '')
                row "$check" "$result" "**NO RESULT**"
                RED="${RED}This gate has no result for \`$check\` — its \`needs:\` list and its manifest disagree. "
                ;;
              *)
                row "$check" "$result" "**NOT a pass**"
                # `cancelled` covers concurrency cancel-in-progress AND the job
                # timeout, and is deliberately red: a suite that was killed proved
                # nothing.
                RED="${RED}\`$check\` concluded \`$result\`. "
                BROKEN="$check"
                ;;
            esac
          done <<< "$JOBS"

          # (4) Positive proof, not merely the absence of failure — the e2e gate's
          #     anti-vacuity lock generalised to N jobs. `needs.<job>.result` reports
          #     what the runner thinks; it does not assert a job of that name ever
          #     existed. Ask the API, once.
          if ! gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
                 --jq '.jobs[] | [.name, (.conclusion // "pending")] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          then
            fail "Could not list this run's jobs, so this gate cannot prove the certified jobs actually ran. Refusing to certify on \`needs.*.result\` alone."
          fi

          while IFS= read -r check; do
            [ -n "$check" ] || continue
            # Last match wins, mirroring the e2e gate's `| last`: re-running a single
            # job appends a second entry under the same name.
            actual=$(awk -F'\t' -v n="$check" '$1 == n { c = $2 } END { print (c == "" ? "missing" : c) }' "$RUNNER_TEMP/jobs.tsv")
            if [ "$actual" != "success" ]; then
              RED="${RED}\`needs\` reported success for \`$check\`, but the job of that name in this run concluded \`$actual\`. Refusing to certify a lane whose job cannot be found. "
            fi
          done < "$CERTIFY"

          # (5) No advisory step to surface here: unlike ci-nfe.yml, this lane has
          #     no `continue-on-error` steps, so every failure inside it is already
          #     fatal and shows up through the normal result path above.

          [ -z "$RED" ] || fail "$RED"

          if [ ! -s "$CERTIFY" ]; then
            pass "No run was required — $REASON See the \`$SCOPE_JOB\` job summary for the full path attribution."
          fi
          pass "Every required job for this lane concluded \`success\`. Scope: $REASON"
