name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One Claude at a time per PR or issue. This lane has `contents: write` and can
# push, so two concurrent runs could both commit to the same branch — a real
# conflict, not just a doubled bill. `cancel-in-progress: false` queues rather
# than killing a run that may be mid-push.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # No exclusion rule is needed for the review lane: it triggers on
    # `@reviewbot`, which does not contain `@claude`, so the two `if:` conditions
    # are disjoint by construction rather than by a guard someone has to
    # maintain. That was the point of giving the review lane its own phrase.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Write, not read: Claude has to be able to answer in a comment and push a
      # branch when you ask it to change something.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    env:
      # In turbo.json's `globalEnv`, so it participates in every task hash. Set
      # to ci.yml's value so a warmed cache entry is the one a later `turbo run`
      # looks up rather than a hash mismatch.
      FUNCTIONS_REGION: us-central1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # `fetch-depth: 0`, not 1: a shallow clone has no merge base, so Claude
      # cannot diff the branch against main to see what actually changed.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Without this bootstrap `@claude` lands in the monorepo with no pnpm and
      # no node_modules, so it cannot run typecheck, lint or a single test.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Shares ci.yml's `pnpm-store-` key namespace so this lane starts warm off
      # the cache every merge to the default branch refreshes.
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache turbo task outputs
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-claude-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            turbo-claude-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-claude-${{ runner.os }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # `|| true` because the branch Claude is asked to work on may legitimately
      # be failing — that is usually why it was tagged.
      - name: Warm the typecheck cache
        run: pnpm turbo run typecheck || true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # `--model` is pinned for the same reason as in claude-code-review.yml:
          # the runner installs Claude Code fresh, so it never sees your local
          # `~/.claude/settings.json`, and an unpinned lane can change models on a
          # Claude Code release with no change here. Exact API id, not a selector
          # shorthand like `opus[1m]`.
          claude_args: |
            --model claude-opus-5

