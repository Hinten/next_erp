name: Claude Code Review

# On-demand code review, requested with a top-level PR comment:
#
#   !reviewbot              -> medium effort (the default)
#   !reviewbot high         -> broader coverage
#   !reviewbot review max   -> the word `review` is optional, for muscle memory
#
# Nothing here runs automatically. Reviewing every push is what exhausted the
# Copilot quota, and this lane bills your Claude subscription via
# CLAUDE_CODE_OAUTH_TOKEN, so asking for a review stays a deliberate act.
#
# ⚠️ The `!` prefix is load-bearing — do not "tidy" this into `@reviewbot`.
# In a GitHub comment `@word` is a USER MENTION: github.com/ReviewBot is a real
# account, so `@reviewbot` rendered as a link to that stranger's profile and
# notified them on every request. Any `@name` trigger has this problem, because
# the name can be registered by someone at any time — the fix is to leave the
# mention namespace entirely, not to hunt for a free handle.
#
# It is also deliberately not `@claude`, which is claude-code-action's default
# phrase and Agent HQ's documented one: keying this lane on it means a second
# Claude workflow — or Agent HQ, if it is ever enabled here — answers the same
# comment and you pay twice for two different reviews. Having its own phrase
# also decouples the lanes: claude.yml needs no exclusion rule, because
# `!reviewbot` does not contain `@claude`.
on:
  issue_comment:
    types: [created]

# One review at a time per PR. Comment twice, or comment while a review is still
# running, and GitHub would otherwise start a second runner — two reviews posted
# on the same diff and double the subscription usage. `cancel-in-progress: false`
# queues the second request instead of killing a review whose tokens are already
# spent, which is how Anthropic's managed Code Review behaves.
concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # A cheap gate job, seconds long and with no checkout. GitHub expressions have
  # no regex, so the `if:` below can only test a prefix — and `!reviewbots should
  # look at this` satisfies a prefix test, which would start a paid review. The
  # strict match is a regex here, and the expensive job depends on its verdict,
  # so a near-miss costs a few runner-seconds instead of a review.
  gate:
    # `issue_comment` fires for issues too, so the pull_request key is what
    # narrows it to PRs. `startsWith` (not `contains`) mirrors the rule
    # Anthropic's managed Code Review uses: the command leads the comment.
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '!reviewbot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      match: ${{ steps.req.outputs.match }}
      effort: ${{ steps.req.outputs.effort }}
    steps:
      # The comment body is untrusted input, so it is read from the environment
      # rather than interpolated into the script with `${{ }}` — that would be a
      # shell-injection hole on a public repo.
      - name: Parse the review request
        id: req
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          first=$(printf '%s' "$COMMENT_BODY" | head -n 1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          if printf '%s' "$first" | grep -qE '^!reviewbot([[:space:]]|$)'; then
            match=true
          else
            match=false
          fi
          # The effort must be the token right after the command, not merely
          # present somewhere on the line — otherwise "!reviewbot please, low
          # risk change" silently downgrades the review to low. The optional
          # `review` word is tolerated so that the habit left over from the
          # earlier `... review high` spellings still lands on the right effort.
          effort=$(printf '%s' "$first" | sed -nE 's#^!reviewbot([[:space:]]+review)?[[:space:]]+(low|medium|high|max)([[:space:]].*)?$#\2#p')
          {
            echo "match=$match"
            echo "effort=${effort:-medium}"
          } >> "$GITHUB_OUTPUT"
          echo "match=$match effort=${effort:-medium}"

  review:
    needs: gate
    if: needs.gate.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Lets Claude read this PR's CI results
    env:
      # FUNCTIONS_REGION is in turbo.json's `globalEnv`, so it participates in
      # every task hash. Set to ci.yml's value so a scoped `turbo run` the
      # reviewer fires can hit the restored cache rather than miss on a hash
      # mismatch.
      FUNCTIONS_REGION: us-central1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # An issue_comment event carries no PR ref, so a bare checkout would hand
      # Claude the default branch and it would review main. `fetch-depth: 0` is
      # what gives `git diff <base>...HEAD` a merge base to work from.
      - name: Checkout the pull request head
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Shares ci.yml's `pnpm-store-` key namespace so this lane starts warm off
      # the cache every merge to the default branch refreshes.
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # Turborepo 2.x keeps its local cache in `.turbo/cache`. A stale entry is
      # harmless — turbo keys entries by content hash, so a miss just rebuilds.
      - name: Cache turbo task outputs
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-review-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.issue.number }}
          restore-keys: |
            turbo-review-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-review-${{ runner.os }}-

      # `node_modules` is what a scratch verification needs — a `node -e` that
      # imports a real module, a targeted vitest run. There is deliberately no
      # typecheck-warming step after it: that existed to make a full
      # `turbo run typecheck` cheap for the reviewer, and the reviewer no longer
      # runs one (ci.yml already did, on this commit). Warming a cache nothing
      # reads costs minutes of Actions time on every review. A scoped
      # `--filter <pkg>` typecheck is fast enough cold.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Posts a tracking comment with progress checkboxes and keeps the full
          # PR context (comments, prior reviews) available to the review.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            REVIEW EFFORT: ${{ needs.gate.outputs.effort }}

            Review this pull request. The working tree is already checked out at
            the PR head with full history and dependencies installed.

            Effort level — this governs how much you report, not how hard you look:
            - low / medium: report only findings you are confident are real.
              Prefer silence over a maybe.
            - high / max: broaden coverage. You may include findings you are less
              sure of, but say so explicitly in the comment.

            The engineering contract is `CLAUDE.md` at the repo root, plus the
            per-app `CLAUDE.md` files and the ADRs under `apps/docs/`. Read the
            ones that cover the paths this PR touches. Violations of those rules
            are findings.

            Do not re-run the repo's gates. CI already ran `turbo run lint
            typecheck`, `turbo run test`, `format:check` and `build` on this
            exact commit, and you can read the results — so a red gate is
            something to look up, never something to reproduce.

            Run things CI cannot. CI answers "do the existing tests pass"; you
            answer "is this correct", and the findings worth having are the ones
            no test covers. When a specific finding turns on behaviour you are
            inferring, build the smallest experiment that settles it — a `node
            -e` against the real module, a scratch vitest on a case you invent,
            a scoped `turbo run typecheck --filter <pkg>` after a type argument.
            Dependencies are installed, so all of that works. A finding you
            confirmed by running something is worth ten you inferred from naming.

            Two cautions. Turbo hashes its declared inputs, not the repo, so a
            turbo task can replay a cached green for a test that greps the
            filesystem; when a result decides whether you report a finding, run
            vitest directly in the workspace instead. And if a command you need
            is not permitted, say so plainly in the review rather than reporting
            findings as if you had verified them.

            House style for the review itself:
            - Inline comments for specific issues; one top-level comment for the
              summary and anything general.
            - Do NOT raise formatting or style nits. Prettier and ESLint own
              those and are already CI gates.
            - Lead the summary with the shape of the work — how many real issues,
              or "no blocking issues" when that is the case.
            - Write in English.
          # ⚠️ Every Bash rule needs the trailing `:*`. `Bash(cmd)` matches that
          # EXACT command string and nothing else, so `Bash(pnpm turbo run
          # typecheck)` did not match `pnpm turbo run lint typecheck` (the form
          # CLAUDE.md documents) or any invocation carrying a `--filter`. An
          # unmatched Bash command does not fail — it asks for approval, and in a
          # workflow nobody answers, so the review silently proceeds without
          # having run anything. Prefixes, not exact commands.
          #
          # `--model` is pinned on purpose. Without it the action uses whatever
          # Claude Code defaults to on a fresh install, which is NOT your local
          # `~/.claude/settings.json` — that file never reaches the runner — and
          # which can change with a Claude Code release without anything here
          # changing. A review lane that reads fiscal code and race guards should
          # not silently switch models. Use the exact API id, not a selector
          # shorthand like `opus[1m]`.
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(pnpm turbo run:*),Bash(pnpm exec:*),Bash(pnpm --filter:*),Bash(pnpm format:check),Bash(npx vitest:*),Bash(node:*)"

  # `review` fails hard, and silently, when CLAUDE_CODE_OAUTH_TOKEN has expired —
  # there is otherwise no PR-visible signal beyond a red X in the Actions tab.
  # This job greps that job's own log for the Claude API's own expired-token
  # error and, only then, leaves a comment saying so. Modeled on
  # ci-nfe.yml's `report-consumo-indevido`: locate one named job by exact match,
  # fetch its log via the Jobs API, grep for one marker, comment only if found,
  # stay silent otherwise — a review that failed for any OTHER reason is out of
  # scope here, same as today (there is no generic failure reporter to defer to).
  report-token-expired:
    name: Detect expired Claude OAuth token
    needs: [gate, review]
    # No fork guard, unlike ci.yml's/ci-nfe.yml's report-failure jobs: those guard
    # `pull-requests: write` because a `pull_request` run from a fork gets a
    # read-only token. This workflow triggers on `issue_comment`, which always
    # runs with the base repo's token regardless of where the PR branch lives —
    # the same property `review` already relies on to use
    # `secrets.CLAUDE_CODE_OAUTH_TOKEN` unconditionally.
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Grep the review job's log for an expired OAuth token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ github.event.issue.number }}
          # Exact match against the published check-run name, never a substring
          # test (see CLAUDE.md / the ci-lanes skill). `review` carries no
          # `name:` override, so its published name is the bare job id.
          REVIEW_JOB_NAME: review
        run: |
          set -uo pipefail
          job_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name == env.REVIEW_JOB_NAME) | .id' | head -n1)
          if [[ -z "$job_id" ]]; then
            echo "Could not locate the '$REVIEW_JOB_NAME' job in this run — nothing to check."
            exit 0
          fi
          if ! gh api "repos/$REPO/actions/jobs/$job_id/logs" > /tmp/review-job.log 2>/dev/null; then
            echo "Log fetch failed — cannot confirm an expired-token failure, staying silent."
            exit 0
          fi
          # Two anchored, low-false-positive substrings lifted verbatim from the
          # real Claude API error body:
          #   {"type":"error","error":{"type":"authentication_error","message":
          #    "OAuth token has expired. Please obtain a new token or refresh
          #    your existing token."}}
          # Deliberately NOT matching a bare `401` — far too broad, would fire on
          # any transient upstream hiccup unrelated to the token.
          if grep -Fq '"authentication_error"' /tmp/review-job.log || \
             grep -Fq 'OAuth token has expired' /tmp/review-job.log; then
            {
              echo "⚠️ **\`!reviewbot\` could not run — \`CLAUDE_CODE_OAUTH_TOKEN\` looks expired.**"
              echo
              echo "The \`review\` job failed with the Claude API's own \`authentication_error\`"
              echo "(\"OAuth token has expired\"), not an issue with this PR."
              echo
              echo "To fix:"
              echo "1. Run \`claude setup-token\` locally (as the token owner) to mint a new token."
              echo "2. Update the repo secret, either:"
              echo "   - \`gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo $REPO\`, or"
              echo "   - GitHub → Settings → Secrets and variables → Actions → \`CLAUDE_CODE_OAUTH_TOKEN\`."
              echo "3. Comment \`!reviewbot\` again to retry."
              echo
              echo "Full logs: $RUN_URL"
            } > /tmp/comment.md
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md
          else
            echo "review job failed for a reason other than an expired OAuth token — nothing posted (out of scope for this job)."
          fi
