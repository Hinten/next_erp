name: E2E — Cadastros

# Master-data e2e suite (smoke + crud-cadastros: clientes, enderecos,
# categorias, depositos, filiais). Triggers on the PR (so it self-tests on the
# PR that introduces it), then delegates to e2e-reusable.yml, which builds
# apps/web for production, serves it, and runs the suite concurrently with the
# offline `CI` workflow (not gated on it). Runs concurrently with E2E — Vendas;
# its own GITHUB_RUN_ID isolates its Firestore namespace + ephemeral user.
#
# ⚠️ There is deliberately NO top-level `paths:` filter here. A `paths:` that does
# not match means GitHub never instantiates the workflow, so it publishes NO check
# run at all — not a failure, not a skip, nothing — and "CI green" stops implying
# "e2e passed". The skip decision lives in the `changes` job below, where the lane
# still reports. See .github/scripts/e2e-affected.mjs for why the old hand-written
# path list was wrong as well as invisible.
on:
  pull_request:
    # The prefix entries cover stacked PRs — see ci.yml. `production` is the
    # release base (main → production); without it the PR that actually ships
    # would run no e2e at all.
    branches: [master, main, production, 'claude/**', 'feat/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: e2e-cadastros-${{ github.ref }}
  cancel-in-progress: true

# Grant the union of what the reusable workflow's jobs request. A reusable
# workflow's per-job permissions can't exceed the caller's token, so without
# this the run fails at startup (the caller would otherwise get the repo's
# read-only default while the e2e job needs pull-requests: write, etc.).
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  # ~20s. Reads the workspace manifests and asks whether anything this lane
  # actually depends on changed. No `pnpm install` — the script is plain Node
  # reading package.json files.
  changes:
    name: E2E scope (cadastros)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `decide` wins when it ran; `collect` supplies the verdict on the
      # non-pull_request path, where there is no diff to classify.
      run_e2e: ${{ steps.decide.outputs.run_e2e || steps.collect.outputs.run_e2e }}
      reason: ${{ steps.decide.outputs.reason || steps.collect.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Only the workspace manifests are read, never history — so there is no
          # merge base to reconstruct and no reason to pay for a deep clone.
          fetch-depth: 1

      - name: Collect the changed paths
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          FILES="$RUNNER_TEMP/changed-files.txt"
          : > "$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          decided() {
            {
              echo "decided=true"
              echo "run_e2e=true"
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            echo "run_e2e=true :: $1"
          }

          # A human asked for this run; there is no diff to narrow it with.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            decided "event is \`$GITHUB_EVENT_NAME\`, not a pull request — running the suite."
            exit 0
          fi

          # `.previous_filename` exists only on renames; including it means moving
          # a file OUT of a dependency directory still counts as touching it.
          if ! gh api "repos/$REPO/pulls/$PR/files" --paginate \
                 --jq '.[] | .filename, (.previous_filename // empty)' > "$FILES"
          then
            decided "could not list the PR's files — running the suite (fail safe)."
            exit 0
          fi

          n=$(wc -l < "$FILES" | tr -d ' ')
          # That endpoint caps at 3000 entries. At the cap we cannot know what was
          # truncated, so we refuse to classify rather than guess.
          if [ "$n" -ge 3000 ]; then
            decided "the API returned $n path(s) — truncated. Running the suite (fail safe)."
            exit 0
          fi
          echo "Collected $n changed path(s)."

      - name: Decide whether this lane must run
        id: decide
        if: steps.collect.outputs.decided != 'true'
        run: |
          node .github/scripts/e2e-affected.mjs \
            --lane cadastros \
            --roots @delfrance/web \
            --files "${{ steps.collect.outputs.files }}"

  cadastros:
    needs: [changes]
    # Fork PRs can't see repo secrets, so the run would only fail noisily at
    # the Firebase steps — skip it. The gate below reports that skip as RED:
    # unverified is not the same as verified. Manual dispatch always runs
    # (same-repo).
    if: >-
      ${{ needs.changes.outputs.run_e2e == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.pull_request.head.repo.fork == false) }}
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      # crud-cadastros-recalculo depends on crud-cadastros (playwright.config.ts)
      # so it only starts once every other cadastros CRUD spec — including
      # their `afterAll` cleanup — has finished, avoiding a shared-catalog
      # write race with the bulk price-recalculation suite (#544).
      projects: smoke crud-cadastros crud-cadastros-recalculo
      slug: cadastros
    secrets: inherit

  # THE pinnable check for this lane. Everything above can legitimately be
  # skipped; this cannot.
  #
  # ⚠️ `if: always()` and NOTHING else, on purpose. A job skipped by `if:` still
  # publishes a check run, with conclusion `skipped`, and GitHub's required-status
  # -check evaluation treats `skipped` as satisfying the requirement. A gate with
  # any other condition would therefore go green in exactly the cases it exists to
  # report on. Do not add one.
  gate:
    name: E2E gate (cadastros)
    needs: [changes, cadastros]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LANE: E2E gate (cadastros)
          # The check-run name GitHub publishes for a reusable-workflow call is
          # "<caller job id> / <called job id>". Keep in sync with the job id above.
          E2E_JOB_NAME: cadastros / e2e
          CHANGES_RESULT: ${{ needs.changes.result }}
          SUITE_RESULT: ${{ needs.cadastros.result }}
          RUN_E2E: ${{ needs.changes.outputs.run_e2e }}
          REASON: ${{ needs.changes.outputs.reason }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          fail() {
            {
              echo "### $LANE — NOT verified"
              echo
              echo "$1"
              echo
              echo "| input | value |"
              echo "| --- | --- |"
              echo "| scope job result | \`$CHANGES_RESULT\` |"
              echo "| scope verdict | \`${RUN_E2E:-<empty>}\` |"
              echo "| suite job result | \`$SUITE_RESULT\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=$LANE::$1"
            exit 1
          }

          pass() {
            {
              echo "### $LANE — verified"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            # Mirror the verdict into the log and the run UI. Without this a PASS is
            # only visible in the step summary, so a green gate cannot be audited
            # from the logs the failure reporters already collect.
            echo "::notice title=$LANE::$1"
            exit 0
          }

          # (1) The decider must have concluded. If it did not, nobody decided
          #     whether this PR needs e2e, and "we do not know" is never green.
          [ "$CHANGES_RESULT" = "success" ] || \
            fail "The scope job concluded \`$CHANGES_RESULT\`, so nothing decided whether this PR needs e2e."

          # (2) ...and it must have produced a verdict. An empty output means the
          #     step died between the API call and the write to \$GITHUB_OUTPUT.
          case "$RUN_E2E" in
            true|false) : ;;
            *) fail "The scope job produced no verdict (\`run_e2e=${RUN_E2E:-<empty>}\`)." ;;
          esac

          # (3) The ONLY green-without-a-run path: nothing this lane depends on
          #     changed, and the suite was skipped on purpose.
          if [ "$RUN_E2E" = "false" ] && [ "$SUITE_RESULT" = "skipped" ]; then
            pass "No e2e run was required — $REASON See the \`E2E scope (cadastros)\` job summary for the full path attribution."
          fi

          # (4) Needed, but skipped. On this lane the only `if:` that can do that
          #     is the fork guard.
          if [ "$SUITE_RESULT" = "skipped" ]; then
            if [ "$IS_FORK" = "true" ]; then
              fail "This PR touches code this lane depends on, but the suite was skipped: it comes from a fork, and fork PRs cannot read the staging Firebase secrets. This code has NOT been exercised against staging. A maintainer must re-run it from an in-repo branch — \`gh pr checkout $PR && git push origin HEAD:fix/pr-$PR-verify\` — and merge that instead."
            fi
            fail "The scope job said this PR needs e2e, but the suite job was skipped for a reason other than the fork guard. Someone added an \`if:\` to it."
          fi

          # (5) Anything other than a clean success is not a pass. `cancelled`
          #     covers both concurrency cancel-in-progress and the job timeout,
          #     and is deliberately red: a suite that was killed proved nothing.
          [ "$SUITE_RESULT" = "success" ] || \
            fail "The e2e suite concluded \`$SUITE_RESULT\`."

          # (6) Positive proof, not merely the absence of failure.
          #     `needs.<job>.result` reports the CALLED WORKFLOW's outcome; it does
          #     not assert that the Playwright job ever existed. Ask the API for it
          #     by name. This is what makes a vacuous pass impossible: if the
          #     reusable workflow is refactored so `e2e` stops running, the gate
          #     goes red instead of inheriting a hollow success.
          if ! conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
                 --jq '[.jobs[] | select(.name == env.E2E_JOB_NAME) | .conclusion] | last // "missing"')
          then
            conclusion="unreachable"
          fi

          [ "$conclusion" = "success" ] || \
            fail "The called workflow reported success, but the job \`$E2E_JOB_NAME\` in this run concluded \`$conclusion\`. Refusing to certify a lane whose suite job cannot be found."

          pass "\`$E2E_JOB_NAME\` concluded \`success\`. Scope: $REASON"
