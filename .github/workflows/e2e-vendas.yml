name: E2E — Vendas

# Sales / fiscal / config e2e suite (configuracoes + crud-vendas: pedidos,
# pedidos-nfe-snapshot, canais-balcao, bandeiras-cartao, motivos-incidente).
# Triggers on the PR (so it self-tests on the PR that introduces it), then
# delegates to e2e-reusable.yml, which builds apps/web for production, serves
# it, and runs the suite concurrently with the offline `CI` workflow (not
# gated on it). Runs concurrently with E2E — Cadastros; its own GITHUB_RUN_ID
# isolates its Firestore namespace + ephemeral user.
on:
  pull_request:
    # The prefix entries cover stacked PRs — see ci.yml.
    branches: [master, main, 'claude/**', 'feat/**', 'fix/**']
    paths:
      - 'apps/web/**'
      # The configuracoes suite drives this app's admin endpoints, and the lane
      # now builds and serves it — so a change there can break this lane.
      - 'apps/integrations/**'
      - 'packages/schemas/**'
      - 'packages/ui/**'
      - 'packages/data/**'
      - 'packages/auth/**'
      - 'packages/core/**'
      - 'tools/test-fixtures/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e-vendas.yml'
      - '.github/workflows/e2e-reusable.yml'
  workflow_dispatch:

concurrency:
  group: e2e-vendas-${{ github.ref }}
  cancel-in-progress: true

# Grant the union of what the reusable workflow's jobs request. A reusable
# workflow's per-job permissions can't exceed the caller's token, so without
# this the run fails at startup (the caller would otherwise get the repo's
# read-only default while the e2e job needs pull-requests: write, etc.).
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  run:
    # Fork PRs can't see repo secrets, so the run would only fail noisily at
    # the Firebase steps — skip it. Manual dispatch always runs (same-repo).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.fork == false }}
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      projects: configuracoes crud-vendas
      slug: vendas
      # configuracoes.spec.ts POSTs to /api/admin/users + .../claims, which are
      # served by apps/integrations on :3001, not by apps/web.
      integrations: true
    secrets: inherit
