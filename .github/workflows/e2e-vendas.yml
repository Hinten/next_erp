name: E2E — Vendas

# Sales / fiscal / config e2e suite (configuracoes + crud-vendas: pedidos,
# pedidos-nfe-snapshot, canais-balcao, bandeiras-cartao, motivos-incidente).
# Triggers on the PR (so it self-tests on the PR that introduces it), then
# delegates to e2e-reusable.yml, which builds apps/web for production, serves
# it, and runs the suite concurrently with the offline `CI` workflow (not
# gated on it). Runs concurrently with E2E — Cadastros; its own GITHUB_RUN_ID
# isolates its Firestore namespace + ephemeral user.
#
# ⚠️ There is deliberately NO top-level `paths:` filter here — see the same note
# in e2e-cadastros.yml. The skip decision lives in the `changes` job below, where
# the lane still reports.
on:
  pull_request:
    # The prefix entries cover stacked PRs — see ci.yml. `production` is the
    # release base (main → production); without it the PR that actually ships
    # would run no e2e at all.
    branches: [master, main, production, 'claude/**', 'feat/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: e2e-vendas-${{ github.ref }}
  cancel-in-progress: true

# Grant the union of what the reusable workflow's jobs request. A reusable
# workflow's per-job permissions can't exceed the caller's token, so without
# this the run fails at startup (the caller would otherwise get the repo's
# read-only default while the e2e job needs pull-requests: write, etc.).
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  # ~20s. Reads the workspace manifests and asks whether anything this lane
  # actually depends on changed. No `pnpm install` — the script is plain Node
  # reading package.json files.
  changes:
    name: E2E scope (vendas)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `decide` wins when it ran; `collect` supplies the verdict on the
      # non-pull_request path, where there is no diff to classify.
      run_e2e: ${{ steps.decide.outputs.run_e2e || steps.collect.outputs.run_e2e }}
      reason: ${{ steps.decide.outputs.reason || steps.collect.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Only the workspace manifests are read, never history — so there is no
          # merge base to reconstruct and no reason to pay for a deep clone.
          fetch-depth: 1

      - name: Collect the changed paths
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          FILES="$RUNNER_TEMP/changed-files.txt"
          : > "$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          decided() {
            {
              echo "decided=true"
              echo "run_e2e=true"
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            echo "run_e2e=true :: $1"
          }

          # A human asked for this run; there is no diff to narrow it with.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            decided "event is \`$GITHUB_EVENT_NAME\`, not a pull request — running the suite."
            exit 0
          fi

          # `.previous_filename` exists only on renames; including it means moving
          # a file OUT of a dependency directory still counts as touching it.
          if ! gh api "repos/$REPO/pulls/$PR/files" --paginate \
                 --jq '.[] | .filename, (.previous_filename // empty)' > "$FILES"
          then
            decided "could not list the PR's files — running the suite (fail safe)."
            exit 0
          fi

          n=$(wc -l < "$FILES" | tr -d ' ')
          # That endpoint caps at 3000 entries. At the cap we cannot know what was
          # truncated, so we refuse to classify rather than guess.
          if [ "$n" -ge 3000 ]; then
            decided "the API returned $n path(s) — truncated. Running the suite (fail safe)."
            exit 0
          fi
          echo "Collected $n changed path(s)."

      - name: Decide whether this lane must run
        id: decide
        if: steps.collect.outputs.decided != 'true'
        # Two roots: this lane also BUILDS AND SERVES apps/integrations on :3001
        # for the configuracoes suite, so a change there can break it.
        #
        # ⚠️ The `if !` fallback is load-bearing, not defensive noise. This YAML comes
        # from the merge ref while the checkout above is the PR head, so on a branch
        # older than the script node exits 1 (`Cannot find module`) before the
        # script's own fail-safe can fire — killing `changes` and reddening a gate
        # that only a rebase could clear. Degrade to RUNNING the lane. See the
        # VERSION SKEW note in e2e-affected.mjs; enforced by ci-lane-gates.test.js.
        run: |
          if ! node .github/scripts/e2e-affected.mjs \
                 --lane vendas \
                 --roots @delfrance/web @delfrance/integrations-app \
                 --self .github/workflows/e2e-vendas.yml .github/workflows/e2e-reusable.yml \
                 --files "${{ steps.collect.outputs.files }}"
          then
            {
              echo "run_e2e=true"
              echo "reason=the scope script could not run at this PR's head commit — it is older than the workflow invoking it. Running the suite (fail safe). Merge \`main\` into this branch for a real scope decision."
            } >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E scope (vendas)::the scope script is missing from this PR's head commit — running the suite (fail safe). Merge main into the branch."
          fi

  vendas-1:
    needs: [changes]
    # Fork PRs can't see repo secrets, so the run would only fail noisily at
    # the Firebase steps — skip it. The gate below reports that skip as RED:
    # unverified is not the same as verified. Manual dispatch always runs
    # (same-repo). ⚠️ A maintainer verifying a fork PR re-runs it from an
    # in-repo branch: `gh pr checkout <n> && git push origin HEAD:fix/pr-<n>-verify`.
    if: >-
      ${{ needs.changes.outputs.run_e2e == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.pull_request.head.repo.fork == false) }}
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      projects: configuracoes crud-vendas
      # ⚠️ `slug` names the report artifact, so it MUST differ per shard —
      # two jobs uploading `playwright-report-vendas` would collide.
      slug: vendas-1
      shard: 1/2
      # ⚠️ The ONLY thing keeping these two jobs from sharing every
      # fixture-isolation key. They are one workflow run, so GITHUB_RUN_ID,
      # GITHUB_WORKFLOW and GITHUB_REF are identical across them; without a
      # distinct slot each would sweep the other's LIVE fixtures and delete the
      # shared ephemeral auth user mid-suite. Must be digits, and must differ.
      run_slot: '1'
      # configuracoes.spec.ts POSTs to /api/admin/users + .../claims, which are
      # served by apps/integrations on :3001, not by apps/web.
      integrations: true
    secrets: inherit

  vendas-2:
    needs: [changes]
    # Fork PRs can't see repo secrets, so the run would only fail noisily at
    # the Firebase steps — skip it. The gate below reports that skip as RED:
    # unverified is not the same as verified. Manual dispatch always runs
    # (same-repo). ⚠️ A maintainer verifying a fork PR re-runs it from an
    # in-repo branch: `gh pr checkout <n> && git push origin HEAD:fix/pr-<n>-verify`.
    if: >-
      ${{ needs.changes.outputs.run_e2e == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.pull_request.head.repo.fork == false) }}
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      projects: configuracoes crud-vendas
      # ⚠️ `slug` names the report artifact, so it MUST differ per shard —
      # two jobs uploading `playwright-report-vendas` would collide.
      slug: vendas-2
      shard: 2/2
      # ⚠️ The ONLY thing keeping these two jobs from sharing every
      # fixture-isolation key. They are one workflow run, so GITHUB_RUN_ID,
      # GITHUB_WORKFLOW and GITHUB_REF are identical across them; without a
      # distinct slot each would sweep the other's LIVE fixtures and delete the
      # shared ephemeral auth user mid-suite. Must be digits, and must differ.
      run_slot: '2'
      # configuracoes.spec.ts POSTs to /api/admin/users + .../claims, which are
      # served by apps/integrations on :3001, not by apps/web.
      integrations: true
    secrets: inherit

  # THE pinnable check for this lane. Everything above can legitimately be
  # skipped; this cannot.
  #
  # ⚠️ `if: always()` and NOTHING else, on purpose. A job skipped by `if:` still
  # publishes a check run, with conclusion `skipped`, and GitHub's required-status
  # -check evaluation treats `skipped` as satisfying the requirement. A gate with
  # any other condition would therefore go green in exactly the cases it exists to
  # report on. Do not add one.
  gate:
    name: E2E gate (vendas)
    needs: [changes, vendas-1, vendas-2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LANE: E2E gate (vendas)
          SCOPE_JOB: E2E scope (vendas)
          PR: ${{ github.event.pull_request.number }}

          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_LANE: ${{ needs.changes.outputs.run_e2e }}
          REASON: ${{ needs.changes.outputs.reason }}

          # --- recorded guards. ONLY these can excuse a skip. ------------------
          GUARD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          GUARD_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}

          # --- per-job results -------------------------------------------------
          RESULT_SHARD_1: ${{ needs.vendas-1.result }}
          RESULT_SHARD_2: ${{ needs.vendas-2.result }}

          # --- the manifest. One row per certified job:
          #       <result env var>|required|optional:<guard>[+<guard>]|<published check-run name>
          #     The check-run name must match the job's `name:` byte for byte — it
          #     is how the anti-vacuity lock finds the job in the jobs API. A
          #     reusable-workflow call publishes as "<caller job id> / <called job
          #     id>", hence `vendas-N / e2e`.
          #
          #     ⚠️ BOTH rows are `required`, and both must stay. The two jobs are a
          #     PARTITION of one suite (`--shard=i/2`): certifying either alone
          #     would report a lane where half the specs never ran, which is the
          #     exact failure this gate exists to make impossible. A fork skip is
          #     therefore RED here, deliberately — unverified is not verified.
          JOBS: |
            RESULT_SHARD_1|required|vendas-1 / e2e
            RESULT_SHARD_2|required|vendas-2 / e2e
        run: |
          set -uo pipefail
          ROWS="$RUNNER_TEMP/gate-rows.md";        : > "$ROWS"
          NOTES="$RUNNER_TEMP/gate-notes.md";      : > "$NOTES"
          CERTIFY="$RUNNER_TEMP/gate-certify.txt"; : > "$CERTIFY"

          row()  { printf '| `%s` | `%s` | %s |\n' "$1" "$2" "$3" >> "$ROWS"; }
          note() { printf '%s\n\n' "$1" >> "$NOTES"; }

          report() {
            {
              echo "### $LANE — $1"
              echo
              echo "$2"
              echo
              echo "| check run | result | verdict |"
              echo "| --- | --- | --- |"
              cat "$ROWS"
              echo
              echo "Scope (\`$SCOPE_JOB\`): \`run=${RUN_LANE:-<empty>}\` — ${REASON:-<none recorded>}"
              echo
              cat "$NOTES"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          fail() { report "NOT verified" "$1"; echo "::error title=$LANE::$1";  exit 1; }
          # Mirror a PASS into the log too: otherwise a green gate is visible only
          # in the step summary, which is not part of what the failure reporters
          # collect, so a green gate could never be audited from the logs.
          pass() { report "verified"     "$1"; echo "::notice title=$LANE::$1"; exit 0; }

          # (1) The decider must have concluded. "We do not know" is never green.
          [ "$CHANGES_RESULT" = "success" ] || \
            fail "The scope job concluded \`$CHANGES_RESULT\`, so nothing decided whether this lane had to run."

          # (2) ...and it must have produced a verdict.
          case "$RUN_LANE" in
            true|false) : ;;
            *) fail "The scope job produced no verdict (\`run=${RUN_LANE:-<empty>}\`)." ;;
          esac

          # explain_skip <guard-spec>: 0 + sets WHY when a RECORDED input accounts
          # for the skip, 1 otherwise. This is the whole trick — the gate re-derives
          # the predicate that should have caused the skip instead of trusting the
          # job's declared class. An `if:` clause nobody taught this function about
          # matches no guard, so the skip goes RED.
          explain_skip() {
            WHY=""
            if [ "$GUARD_DISPATCH" = "true" ]; then return 1; fi
            local g
            local IFS='+'
            for g in $1; do
              case "$g" in
                not_fork)
                  if [ "${GUARD_FORK:-}" = "true" ]; then
                    WHY="this PR comes from a fork, and fork PRs cannot read repo secrets. A maintainer can verify from an in-repo branch: \`gh pr checkout $PR && git push origin HEAD:fix/pr-$PR-verify\`."
                    return 0
                  fi ;;
                *) return 1 ;;
              esac
            done
            return 1
          }

          # (3) Walk the manifest.
          #     `done <<< "$JOBS"` is a HERESTRING, not a pipe: a pipe would run the
          #     loop in a subshell and every RED/BROKEN assignment would be
          #     discarded, making this gate unconditionally green.
          RED=""; BROKEN=""
          while IFS='|' read -r var class check; do
            case "${var:-}" in ''|'#'*) continue ;; esac
            result="${!var:-}"

            case "$class" in
              required)   guards='' ;;
              optional:*) guards="${class#optional:}" ;;
              *) fail "Gate manifest error: \`$check\` declares an unknown class \`$class\`. Refusing to certify a lane whose own manifest this gate cannot parse." ;;
            esac

            case "$result" in
              success)
                printf '%s\n' "$check" >> "$CERTIFY"
                row "$check" "$result" "ran and passed"
                ;;
              skipped)
                if [ -n "$BROKEN" ]; then
                  row "$check" "$result" "not reached — \`$BROKEN\` did not succeed"
                elif [ "$RUN_LANE" = "false" ]; then
                  row "$check" "$result" "not required — nothing this lane depends on changed"
                elif [ -n "$guards" ] && explain_skip "$guards"; then
                  row "$check" "$result" "**DID NOT RUN** — $WHY"
                  note "**\`$check\` did not run on this PR** — $WHY"
                  echo "::warning title=$LANE::\`$check\` did not run — $WHY"
                elif [ -z "$guards" ] && [ "${GUARD_FORK:-}" = "true" ]; then
                  # A `required` job carries no guards, so `explain_skip` above is
                  # never consulted for it and the `else` below would blame an
                  # `if:` nobody added. The verdict stays RED on purpose --
                  # `required` is how a lane says "unverified is not verified" --
                  # but a fork skip has a known cause and a remedy, and printing
                  # the wrong one sends the maintainer hunting.
                  row "$check" "$result" "**DID NOT RUN** -- fork PR"
                  RED="${RED}\`$check\` did not run: this PR comes from a fork, and fork PRs cannot read the repo secrets this job needs, so that code has NOT been exercised. It is \`required\`, so this reads RED rather than green. A maintainer can verify it from an in-repo branch -- \`gh pr checkout $PR && git push origin HEAD:fix/pr-$PR-verify\` -- and merge that instead. "
                else
                  row "$check" "$result" "**UNEXPLAINED SKIP**"
                  RED="${RED}\`$check\` was skipped and this gate cannot explain why: the lane is in scope and no recorded guard (${guards:-none, this job is required}) accounts for it. Someone added an \`if:\` without teaching the gate about it. "
                fi
                ;;
              '')
                row "$check" "$result" "**NO RESULT**"
                RED="${RED}This gate has no result for \`$check\` — its \`needs:\` list and its manifest disagree. "
                ;;
              *)
                row "$check" "$result" "**NOT a pass**"
                # `cancelled` covers concurrency cancel-in-progress AND the job
                # timeout, and is deliberately red: a suite that was killed proved
                # nothing.
                RED="${RED}\`$check\` concluded \`$result\`. "
                BROKEN="$check"
                ;;
            esac
          done <<< "$JOBS"

          # (4) Positive proof, not merely the absence of failure — the e2e gate's
          #     anti-vacuity lock generalised to N jobs. `needs.<job>.result` reports
          #     what the runner thinks; it does not assert a job of that name ever
          #     existed. Ask the API, once.
          if ! gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
                 --jq '.jobs[] | [.name, (.conclusion // "pending")] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          then
            fail "Could not list this run's jobs, so this gate cannot prove the certified jobs actually ran. Refusing to certify on \`needs.*.result\` alone."
          fi

          while IFS= read -r check; do
            [ -n "$check" ] || continue
            # Last match wins, mirroring the e2e gate's `| last`: re-running a single
            # job appends a second entry under the same name.
            actual=$(awk -F'\t' -v n="$check" '$1 == n { c = $2 } END { print (c == "" ? "missing" : c) }' "$RUNNER_TEMP/jobs.tsv")
            if [ "$actual" != "success" ]; then
              RED="${RED}\`needs\` reported success for \`$check\`, but the job of that name in this run concluded \`$actual\`. Refusing to certify a lane whose job cannot be found. "
            fi
          done < "$CERTIFY"

          # (5) No advisory step to surface here: unlike ci-nfe.yml, this lane has
          #     no `continue-on-error` steps, so every failure inside it is already
          #     fatal and shows up through the normal result path above.

          [ -z "$RED" ] || fail "$RED"

          if [ ! -s "$CERTIFY" ]; then
            pass "No run was required — $REASON See the \`$SCOPE_JOB\` job summary for the full path attribution."
          fi
          pass "Every required job for this lane concluded \`success\`. Scope: $REASON"
