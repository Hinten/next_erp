name: E2E — Emulator (callables + triggers)

# Runs every `*.emulator.e2e.spec.ts` against the Firebase Emulator Suite
# (Auth + Firestore + Storage + Functions), where the `storage`-codebase functions
# are served LOCALLY from source — so each UI → callable/trigger → Firestore flow is
# validated in CI without a staging deploy. Covers `aplicarEstoque` (estoque tab),
# `reconciliarPagamentoPedido` (pedido Pagamentos tab, #308) and the produto triggers.
#
# Deliberately scoped: these specs run here because they depend on Cloud Functions
# that are only live once a human deploys them. Every other e2e spec still runs
# against staging (CLAUDE.md's "app/e2e on staging" decision holds). This lane
# is OFFLINE — it needs no Firebase secrets, so it also runs on fork PRs.
#
# Machinery mirrors ci-storage.yml (JDK + firebase-tools + emulators:exec) and
# e2e-reusable.yml (production build + Playwright webServer + failure comment).

on:
  pull_request:
    # The prefix entries cover stacked PRs — see ci.yml. `production` is the
    # release base (main → production); without it the PR that actually ships
    # would run no e2e at all.
    branches: [master, main, production, 'claude/**', 'feat/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ~20s. Reads the workspace manifests and asks whether anything this lane
  # actually depends on changed. No `pnpm install` — the script is plain Node
  # reading package.json files.
  changes:
    name: E2E scope (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `decide` wins when it ran; `collect` supplies the verdict on the
      # non-pull_request path, where there is no diff to classify.
      run_e2e: ${{ steps.decide.outputs.run_e2e || steps.collect.outputs.run_e2e }}
      reason: ${{ steps.decide.outputs.reason || steps.collect.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Only the workspace manifests are read, never history — so there is no
          # merge base to reconstruct and no reason to pay for a deep clone.
          fetch-depth: 1

      - name: Collect the changed paths
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          FILES="$RUNNER_TEMP/changed-files.txt"
          : > "$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          decided() {
            {
              echo "decided=true"
              echo "run_e2e=true"
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            echo "run_e2e=true :: $1"
          }

          # A human asked for this run; there is no diff to narrow it with.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            decided "event is \`$GITHUB_EVENT_NAME\`, not a pull request — running the suite."
            exit 0
          fi

          # `.previous_filename` exists only on renames; including it means moving
          # a file OUT of a dependency directory still counts as touching it.
          if ! gh api "repos/$REPO/pulls/$PR/files" --paginate \
                 --jq '.[] | .filename, (.previous_filename // empty)' > "$FILES"
          then
            decided "could not list the PR's files — running the suite (fail safe)."
            exit 0
          fi

          n=$(wc -l < "$FILES" | tr -d ' ')
          # That endpoint caps at 3000 entries. At the cap we cannot know what was
          # truncated, so we refuse to classify rather than guess.
          if [ "$n" -ge 3000 ]; then
            decided "the API returned $n path(s) — truncated. Running the suite (fail safe)."
            exit 0
          fi
          echo "Collected $n changed path(s)."

      - name: Decide whether this lane must run
        id: decide
        if: steps.collect.outputs.decided != 'true'
        # Two roots: firebase.e2e.json serves the `storage` functions codebase
        # FROM SOURCE, so a functions-only PR must run this lane — it is the only
        # lane that exercises those callables and triggers at all.
        run: |
          node .github/scripts/e2e-affected.mjs \
            --lane emulator \
            --roots @delfrance/web @delfrance/functions \
            --self .github/workflows/e2e-emulator.yml \
            --files "${{ steps.collect.outputs.files }}"

  e2e-emulator:
    name: Emulator e2e (auth + firestore + functions)
    needs: [changes]
    if: ${{ needs.changes.outputs.run_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Inlined into the functions bundle at build time (build.mjs) AND used as the
      # functions emulator's region — must match the client's NEXT_PUBLIC_FUNCTIONS_REGION.
      FUNCTIONS_REGION: us-east1
      # Demo/emulator project — no real credentials, nothing touches staging. The
      # named `default` database is used everywhere (gotcha #8), incl. the emulator.
      FIREBASE_PROJECT_ID: demo-erp
      FIREBASE_DATABASE_ID: default
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The Firebase Emulator Suite runs on the JVM; firebase-tools >= 15 needs JDK 21+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install firebase-tools (pinned)
        run: npm i -g firebase-tools@15.15.0

      # Not the Playwright container here (that image lacks the JVM); ubuntu-latest
      # + `--with-deps` installs Chromium and its apt system libraries.
      - name: Ensure Chromium + system deps
        run: pnpm --filter @delfrance/web exec playwright install --with-deps chromium

      - name: Build functions bundle
        run: pnpm --filter @delfrance/functions build

      # Distinct from the staging e2e build cache (`-emulator-`): this build inlines
      # the emulator flag, so its output must never be reused by the staging lanes.
      - name: Cache Next.js build (web, emulator)
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: nextjs-web-emulator-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            nextjs-web-emulator-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build web (emulator mode)
        # NEXT_PUBLIC_* are inlined at build time. The emulator flag + host make the
        # client connect Auth/Firestore/Functions to the local emulators; the rest is
        # dummy Firebase config the emulators ignore (no real key/bucket needed). No
        # emulator spec touches Storage from the browser, so no storage-emulator
        # client wiring.
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'true'
          NEXT_PUBLIC_FIREBASE_EMULATOR_HOST: 127.0.0.1
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-erp
          NEXT_PUBLIC_FIREBASE_DATABASE_ID: default
          NEXT_PUBLIC_FUNCTIONS_REGION: us-east1
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-erp.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-erp.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:demo'
          E2E_SOURCEMAPS: 'true'
        run: pnpm --filter @delfrance/web exec next build

      - name: e2e (estoque) on the emulators
        # emulators:exec boots the suite and exports FIRESTORE_EMULATOR_HOST /
        # FIREBASE_AUTH_EMULATOR_HOST to the child, so globalSetup's Admin-SDK
        # fixtures (seed / ephemeral user / claims) target the emulator with no
        # service account. Playwright's webServer runs `next start` (prod build,
        # already wired to the emulators via the build-time flag); the `emulator`
        # project collects every `*.emulator.e2e.spec.ts` by filename suffix — a new
        # spec needs no wiring here. GITHUB_RUN_ID (auto) keeps the fixture
        # namespace consistent, matching firestore.e2e.rules.
        run: |
          firebase emulators:exec \
            --config firebase.e2e.json \
            --project demo-erp \
            --only auth,firestore,storage,functions \
            "PLAYWRIGHT_WEB_CMD='pnpm exec next start --port 3000' pnpm --filter @delfrance/web exec playwright test --project=emulator"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-emulator
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Downstream job (not a step) so it starts AFTER e2e-emulator concludes and can
  # fetch its logs. Mirrors e2e-reusable.yml's report-failure.
  report-failure:
    # Named explicitly: without a `name:` this job published as bare
    # `report-failure`, byte-identical to e2e-reusable.yml's reporter. A check-run
    # name carries no workflow prefix, so the two were indistinguishable in the PR
    # checks list — the same collision this PR removes across the domain lanes.
    name: Emulator failure note
    needs: [e2e-emulator]
    if: ${{ always() && needs.e2e-emulator.result == 'failure' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # Checked out ONLY to supply the stale-base-hint composite action. Pinned
      # to the BASE ref, never the PR head: this job holds `pull-requests: write`,
      # so the script it executes has to come from trusted `main` rather than
      # from the branch under test.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Collect failure log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SLUG: emulator
        run: |
          set -uo pipefail
          gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > /tmp/failed-jobs.tsv || true
          {
            echo "## E2E falhou — e2e ($SLUG)"
            echo
            echo "Commit <code>${HEAD_SHA:0:7}</code> · [ver run completo]($RUN_URL)"
            echo
          } > /tmp/body.md
          if [ -s /tmp/failed-jobs.tsv ]; then
            while IFS=$'\t' read -r job_id job_name; do
              gh api "repos/$REPO/actions/jobs/$job_id/logs" > "/tmp/job-$job_id.log" 2>/dev/null \
                || echo "(log indisponível — abra o run no GitHub)" > "/tmp/job-$job_id.log"
              {
                echo "<details>"
                echo "<summary>Job <code>$job_name</code> — últimos 12KB do log</summary>"
                echo
                echo '```'
                tail -c 12000 "/tmp/job-$job_id.log"
                echo
                echo '```'
                echo
                echo "</details>"
                echo
              } >> /tmp/body.md
            done < /tmp/failed-jobs.tsv
          fi

      # Reads the /tmp/job-*.log files written above, so it must run after them.
      - name: Stale-base hint
        uses: ./.github/actions/stale-base-hint
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment failure log on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # The hint leads — it is the thing that stops someone reading a trace
          # for a failure their base already fixed. Empty file when not stale,
          # leaving the comment byte-identical to before. `touch` so a skipped
          # or half-run hint step can never break the comment.
          touch /tmp/stale-hint.md
          cat /tmp/stale-hint.md /tmp/body.md > /tmp/comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md || true

  # THE pinnable check for this lane. Everything above can legitimately be
  # skipped; this cannot.
  #
  # ⚠️ `if: always()` and NOTHING else, on purpose. A job skipped by `if:` still
  # publishes a check run, with conclusion `skipped`, and GitHub's required-status
  # -check evaluation treats `skipped` as satisfying the requirement. That is
  # exactly why `Emulator e2e (auth + firestore + functions)` — pinnable before the
  # `changes` job existed — must NOT be the pinned check any more: it is skippable
  # now, so pinning it would be a pass by absence. Pin this job instead.
  gate:
    name: E2E gate (emulator)
    needs: [changes, e2e-emulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LANE: E2E gate (emulator)
          # Not a reusable call, so the published check-run name is this job's
          # `name:` verbatim — no "<caller> /" prefix. Getting this wrong makes the
          # gate red on every green run.
          E2E_JOB_NAME: Emulator e2e (auth + firestore + functions)
          CHANGES_RESULT: ${{ needs.changes.result }}
          SUITE_RESULT: ${{ needs.e2e-emulator.result }}
          RUN_E2E: ${{ needs.changes.outputs.run_e2e }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          set -uo pipefail

          fail() {
            {
              echo "### $LANE — NOT verified"
              echo
              echo "$1"
              echo
              echo "| input | value |"
              echo "| --- | --- |"
              echo "| scope job result | \`$CHANGES_RESULT\` |"
              echo "| scope verdict | \`${RUN_E2E:-<empty>}\` |"
              echo "| suite job result | \`$SUITE_RESULT\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=$LANE::$1"
            exit 1
          }

          pass() {
            {
              echo "### $LANE — verified"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            # Mirror the verdict into the log and the run UI. Without this a PASS is
            # only visible in the step summary, so a green gate cannot be audited
            # from the logs the failure reporters already collect.
            echo "::notice title=$LANE::$1"
            exit 0
          }

          # (1) The decider must have concluded. If it did not, nobody decided
          #     whether this PR needs e2e, and "we do not know" is never green.
          [ "$CHANGES_RESULT" = "success" ] || \
            fail "The scope job concluded \`$CHANGES_RESULT\`, so nothing decided whether this PR needs e2e."

          # (2) ...and it must have produced a verdict. An empty output means the
          #     step died between the API call and the write to \$GITHUB_OUTPUT.
          case "$RUN_E2E" in
            true|false) : ;;
            *) fail "The scope job produced no verdict (\`run_e2e=${RUN_E2E:-<empty>}\`)." ;;
          esac

          # (3) The ONLY green-without-a-run path: nothing this lane depends on
          #     changed, and the suite was skipped on purpose.
          if [ "$RUN_E2E" = "false" ] && [ "$SUITE_RESULT" = "skipped" ]; then
            pass "No e2e run was required — $REASON See the \`E2E scope (emulator)\` job summary for the full path attribution."
          fi

          # (4) This lane is OFFLINE — it reads no Firebase secrets, so it has no
          #     fork guard and the scope job is the only thing that can skip it.
          #     A skip here with the scope job saying "run" means someone added an
          #     `if:` to the suite job.
          if [ "$SUITE_RESULT" = "skipped" ]; then
            fail "The scope job said this PR needs e2e, but the suite job was skipped. This lane has no fork guard, so someone added an \`if:\` to it."
          fi

          # (5) Anything other than a clean success is not a pass. `cancelled`
          #     covers both concurrency cancel-in-progress and the job timeout,
          #     and is deliberately red: a suite that was killed proved nothing.
          [ "$SUITE_RESULT" = "success" ] || \
            fail "The e2e suite concluded \`$SUITE_RESULT\`."

          # (6) Positive proof, not merely the absence of failure — the named job
          #     must actually exist in this run with conclusion `success`.
          if ! conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
                 --jq '[.jobs[] | select(.name == env.E2E_JOB_NAME) | .conclusion] | last // "missing"')
          then
            conclusion="unreachable"
          fi

          [ "$conclusion" = "success" ] || \
            fail "The suite job reported success, but the job \`$E2E_JOB_NAME\` in this run concluded \`$conclusion\`. Refusing to certify a lane whose suite job cannot be found."

          pass "\`$E2E_JOB_NAME\` concluded \`success\`. Scope: $REASON"
