name: CI — Freight

# Dedicated freight (Melhor Envio) pipeline. Runs **only** when the ME app or
# its freight workspace deps change, so non-freight PRs aren't gated by it. The
# headline `ci.yml` still typechecks the whole graph (so a `core`/`data` change
# that breaks freight is caught there); this adds a focused
# lint/typecheck/unit/build lane for the freight packages, plus an **opt-in**
# live Melhor Envio sandbox lane that's off by default.
on:
  push:
    branches: [master, main]
    paths:
      - 'apps/melhor-envio/**'
      - 'packages/integrations/freight-br/**'
      # Under `shared/` since 6ab8d290 — a stale root path silently matches nothing.
      - 'packages/schemas/src/shared/frete.ts'
      - 'packages/schemas/src/integracao.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-freight.yml'
  pull_request:
    # The prefix entries cover stacked PRs — see ci.yml. `production` is the
    # release base (main → production); without it this lane reports no check at
    # all on the PR that actually ships.
    branches: [master, main, production, 'claude/**', 'feat/**', 'fix/**']
    # ⚠️ NO `paths:` here, deliberately — a non-matching `paths:` publishes NO
    # check run at all, so nothing can be pinned to this lane. Scope lives in the
    # `changes` job below. The list this replaces named two files under
    # `packages/schemas` and nothing else: it never contained `packages/data`,
    # which `@delfrance/integrations-freight-br` depends on, and `ci.yml` excludes
    # that package from `turbo run test` — so on a data-only PR the freight tests
    # ran NOWHERE. `push:` keeps its `paths:`; see the note in ci-nfe.yml.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ~20s. Reads the workspace manifests and asks whether anything this lane
  # actually depends on changed. No `pnpm install` — plain Node reading
  # package.json files.
  changes:
    name: CI scope (freight)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # `run_e2e` keeps its historical name — it is the wire format of
      # e2e-affected.mjs, shared with the e2e lanes. Read it as "run this lane".
      run_e2e: ${{ steps.decide.outputs.run_e2e || steps.collect.outputs.run_e2e }}
      reason: ${{ steps.decide.outputs.reason || steps.collect.outputs.reason }}
      live_enabled: ${{ steps.live.outputs.live_enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Collect the changed paths
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          FILES="$RUNNER_TEMP/changed-files.txt"
          : > "$FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          decided() {
            {
              echo "decided=true"
              echo "run_e2e=true"
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            echo "run_e2e=true :: $1"
          }

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            decided "event is \`$GITHUB_EVENT_NAME\`, not a pull request — running the lane."
            exit 0
          fi

          if ! gh api "repos/$REPO/pulls/$PR/files" --paginate \
                 --jq '.[] | .filename, (.previous_filename // empty)' > "$FILES"
          then
            decided "could not list the PR's files — running the lane (fail safe)."
            exit 0
          fi

          n=$(wc -l < "$FILES" | tr -d ' ')
          if [ "$n" -ge 3000 ]; then
            decided "the API returned $n path(s) — truncated. Running the lane (fail safe)."
            exit 0
          fi
          echo "Collected $n changed path(s)."

      - name: Decide whether this lane must run
        id: decide
        if: steps.collect.outputs.decided != 'true'
        run: |
          node .github/scripts/e2e-affected.mjs \
            --kind CI \
            --lane freight \
            --roots @delfrance/melhor-envio-app @delfrance/integrations-freight-br \
            --self .github/workflows/ci-freight.yml \
            --files "${{ steps.collect.outputs.files }}"

      - name: Record the live-lane switch
        id: live
        # Read ONCE here and threaded, so `freight-live`'s `if:` and the gate's
        # explanation quote the same value instead of two reads of live repo state
        # that can disagree. See the longer note in ci-nfe.yml.
        #
        # ⚠️ `FREIGHT_CI_LIVE_ENABLED` is NOT SET on this repo, so this resolves to
        # false on every PR and push, and `calculate.sandbox.test.ts` has never run
        # in CI. That is not new — but until now it was invisible. The gate below
        # states it on every PR. Enabling it needs the secret
        # MELHOR_ENVIO_SANDBOX_TOKEN and the variable MELHOR_ENVIO_USER_AGENT,
        # neither of which exists yet.
        env:
          FREIGHT_CI_LIVE_ENABLED: ${{ vars.FREIGHT_CI_LIVE_ENABLED }}
        run: |
          if [ "${FREIGHT_CI_LIVE_ENABLED:-}" = "true" ]; then
            echo "live_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "live_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "FREIGHT_CI_LIVE_ENABLED=${FREIGHT_CI_LIVE_ENABLED:-<unset>}"

  freight-build-test:
    name: Freight offline (lint + typecheck + unit + build)
    needs: [changes]
    if: ${{ needs.changes.outputs.run_e2e == 'true' }}
    runs-on: ubuntu-latest
    # Observed max across 15 successful runs: 2.4 min.
    timeout-minutes: 20
    env:
      # Skip Next.js telemetry collection + its build-time notice (matches ci.yml).
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          # On pull_request, pin the PR head; on push/dispatch the PR context is
          # unset, so fall back to the triggering commit (same pattern as
          # ci-nfe.yml / e2e-reusable.yml).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm turbo run lint \
            --filter @delfrance/melhor-envio-app \
            --filter @delfrance/integrations-freight-br

      - name: Typecheck
        run: |
          pnpm turbo run typecheck \
            --filter @delfrance/melhor-envio-app \
            --filter @delfrance/integrations-freight-br

      - name: Unit tests (offline)
        # The live lane lives in `*.sandbox.test.ts` — it skips locally without
        # a token but THROWS when collected in CI (CI=true), so it must NOT be
        # collected here. Turbo forwards the args after `--` to each `vitest
        # run`. The sandbox suite runs in `freight-live` below, invoked by name
        # and gated by the live flag + secret.
        run: |
          pnpm turbo run test \
            --filter @delfrance/melhor-envio-app \
            --filter @delfrance/integrations-freight-br \
            -- --exclude '**/*.sandbox.test.ts'

      # Persist the ME app's incremental Next.js build cache across runs
      # (matches ci.yml). Keyed on the head SHA actually built; restore the
      # newest prior cache via restore-keys so iterative PR pushes aren't cold.
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/melhor-envio/.next/cache
          key: nextjs-freight-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            nextjs-freight-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm --filter @delfrance/melhor-envio-app build

  freight-live:
    name: Freight live (Melhor Envio sandbox)
    runs-on: ubuntu-latest
    # Never yet observed running — see the ⚠️ on the `live` step above.
    timeout-minutes: 20
    needs: [changes, freight-build-test]
    # Opt-in: skips on normal PRs (incl. fork PRs that can't read secrets)
    # unless the repo variable is flipped on; always runs on manual dispatch.
    # Default-off so a missing/expired sandbox token never reds a freight PR.
    #
    # Each clause maps to a guard the gate can name: the lane being in scope, the
    # threaded `live_enabled`, and the fork check. A skip the gate cannot attribute
    # to one of those turns it RED.
    if: >-
      ${{ needs.changes.outputs.run_e2e == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (needs.changes.outputs.live_enabled == 'true' &&
            github.event.pull_request.head.repo.fork == false)) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          # No version pinned on purpose: corepack takes it from
          # `packageManager` in package.json — the single source of
          # truth — and overrides any `corepack prepare` pin.
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify live-test secret is configured
        # Fail loud + early when the token is missing instead of letting the
        # suite's `describe.skip` silently drop every live test (a green CI that
        # actually ran nothing).
        env:
          MELHOR_ENVIO_SANDBOX_TOKEN: ${{ secrets.MELHOR_ENVIO_SANDBOX_TOKEN }}
        run: |
          if [[ -z "${MELHOR_ENVIO_SANDBOX_TOKEN:-}" ]]; then
            echo "::error::Missing required secret MELHOR_ENVIO_SANDBOX_TOKEN for freight-live."
            echo "Mint a sandbox access token (OAuth connect on a sandbox ME account) and set it at https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "MELHOR_ENVIO_SANDBOX_TOKEN is configured."

      - name: Run live sandbox tests (read-only — /me, /me/balance, calculate)
        env:
          MELHOR_ENVIO_SANDBOX: 'true'
          MELHOR_ENVIO_SANDBOX_TOKEN: ${{ secrets.MELHOR_ENVIO_SANDBOX_TOKEN }}
          MELHOR_ENVIO_USER_AGENT: ${{ vars.MELHOR_ENVIO_USER_AGENT }}
        run: |
          pnpm --filter @delfrance/integrations-freight-br test calculate.sandbox

  report-failure:
    # Renamed: three lanes published a check literally named `Post failure note on
    # PR`. A check-run name carries no workflow prefix, so they were
    # indistinguishable in the PR list — and unpinnable.
    name: Freight failure note
    needs: [changes, freight-build-test, freight-live]
    # Same-repo PRs only — fork runs get a read-only token and can't comment,
    # which would 403 here and mask the original failure (same guard as ci.yml).
    if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment failure summary
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const body =
              `❌ \`ci-freight.yml\` failed on this PR.\n\n` +
              `See the Actions tab for full logs: ` +
              `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber, body,
            });

  # THE pinnable check for this lane. Everything above can legitimately be
  # skipped; this cannot.
  #
  # ⚠️ `if: always()` and NOTHING else, on purpose. A job skipped by `if:` still
  # publishes a check run, with conclusion `skipped`, and GitHub's required-
  # status-check evaluation treats `skipped` as SATISFYING the requirement. A gate
  # carrying any other condition would go green in exactly the cases it exists to
  # report on. Do not add one.
  #
  # ⚠️ `needs:` lists the CERTIFIABLE jobs only. The report-* jobs are `skipped` on
  # every green run, so needing them would make this gate permanently red.
  gate:
    name: CI gate (freight)
    needs: [changes, freight-build-test, freight-live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LANE: CI gate (freight)
          SCOPE_JOB: CI scope (freight)
          PR: ${{ github.event.pull_request.number }}

          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_LANE: ${{ needs.changes.outputs.run_e2e }}
          REASON: ${{ needs.changes.outputs.reason }}

          # --- recorded guards. ONLY these can excuse a skip. ------------------
          GUARD_LIVE_ENABLED: ${{ needs.changes.outputs.live_enabled }}
          GUARD_LIVE_VAR: FREIGHT_CI_LIVE_ENABLED
          GUARD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          GUARD_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}

          # --- per-job results -------------------------------------------------
          RESULT_OFFLINE: ${{ needs.freight-build-test.result }}
          RESULT_LIVE: ${{ needs.freight-live.result }}

          # --- the manifest. One row per certified job:
          #       <result env var>|required|optional:<guard>[+<guard>]|<published check-run name>
          #     The check-run name must match the job's `name:` byte for byte — it
          #     is how the anti-vacuity lock finds the job in the jobs API.
          JOBS: |
            RESULT_OFFLINE|required|Freight offline (lint + typecheck + unit + build)
            RESULT_LIVE|optional:live_enabled+not_fork|Freight live (Melhor Envio sandbox)
        run: |
          set -uo pipefail
          ROWS="$RUNNER_TEMP/gate-rows.md";        : > "$ROWS"
          NOTES="$RUNNER_TEMP/gate-notes.md";      : > "$NOTES"
          CERTIFY="$RUNNER_TEMP/gate-certify.txt"; : > "$CERTIFY"

          row()  { printf '| `%s` | `%s` | %s |\n' "$1" "$2" "$3" >> "$ROWS"; }
          note() { printf '%s\n\n' "$1" >> "$NOTES"; }

          report() {
            {
              echo "### $LANE — $1"
              echo
              echo "$2"
              echo
              echo "| check run | result | verdict |"
              echo "| --- | --- | --- |"
              cat "$ROWS"
              echo
              echo "Scope (\`$SCOPE_JOB\`): \`run=${RUN_LANE:-<empty>}\` — ${REASON:-<none recorded>}"
              echo
              cat "$NOTES"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          fail() { report "NOT verified" "$1"; echo "::error title=$LANE::$1";  exit 1; }
          # Mirror a PASS into the log too: otherwise a green gate is visible only
          # in the step summary, which is not part of what the failure reporters
          # collect, so a green gate could never be audited from the logs.
          pass() { report "verified"     "$1"; echo "::notice title=$LANE::$1"; exit 0; }

          # (1) The decider must have concluded. "We do not know" is never green.
          [ "$CHANGES_RESULT" = "success" ] || \
            fail "The scope job concluded \`$CHANGES_RESULT\`, so nothing decided whether this lane had to run."

          # (2) ...and it must have produced a verdict.
          case "$RUN_LANE" in
            true|false) : ;;
            *) fail "The scope job produced no verdict (\`run=${RUN_LANE:-<empty>}\`)." ;;
          esac

          # explain_skip <guard-spec>: 0 + sets WHY when a RECORDED input accounts
          # for the skip, 1 otherwise. This is the whole trick — the gate re-derives
          # the predicate that should have caused the skip instead of trusting the
          # job's declared class. An `if:` clause nobody taught this function about
          # matches no guard, so the skip goes RED.
          explain_skip() {
            WHY=""
            if [ "$GUARD_DISPATCH" = "true" ]; then return 1; fi
            local g
            local IFS='+'
            for g in $1; do
              case "$g" in
                live_enabled)
                  if [ "${GUARD_LIVE_ENABLED:-}" != "true" ]; then
                    WHY="the repo variable \`$GUARD_LIVE_VAR\` is not \`true\`, so the live suite is switched off. **calculate.sandbox.test.ts did not run — it has never run in CI.**"
                    return 0
                  fi ;;
                not_fork)
                  if [ "${GUARD_FORK:-}" = "true" ]; then
                    WHY="this PR comes from a fork, and fork PRs cannot read repo secrets. A maintainer can verify from an in-repo branch: \`gh pr checkout $PR && git push origin HEAD:fix/pr-$PR-verify\`."
                    return 0
                  fi ;;
                *) return 1 ;;
              esac
            done
            return 1
          }

          # (3) Walk the manifest.
          #     `done <<< "$JOBS"` is a HERESTRING, not a pipe: a pipe would run the
          #     loop in a subshell and every RED/BROKEN assignment would be
          #     discarded, making this gate unconditionally green.
          RED=""; BROKEN=""
          while IFS='|' read -r var class check; do
            case "${var:-}" in ''|'#'*) continue ;; esac
            result="${!var:-}"

            case "$class" in
              required)   guards='' ;;
              optional:*) guards="${class#optional:}" ;;
              *) fail "Gate manifest error: \`$check\` declares an unknown class \`$class\`. Refusing to certify a lane whose own manifest this gate cannot parse." ;;
            esac

            case "$result" in
              success)
                printf '%s\n' "$check" >> "$CERTIFY"
                row "$check" "$result" "ran and passed"
                ;;
              skipped)
                if [ -n "$BROKEN" ]; then
                  row "$check" "$result" "not reached — \`$BROKEN\` did not succeed"
                elif [ "$RUN_LANE" = "false" ]; then
                  row "$check" "$result" "not required — nothing this lane depends on changed"
                elif [ -n "$guards" ] && explain_skip "$guards"; then
                  row "$check" "$result" "**DID NOT RUN** — $WHY"
                  note "**\`$check\` did not run on this PR** — $WHY"
                  echo "::warning title=$LANE::\`$check\` did not run — $WHY"
                else
                  row "$check" "$result" "**UNEXPLAINED SKIP**"
                  RED="${RED}\`$check\` was skipped and this gate cannot explain why: the lane is in scope and no recorded guard (${guards:-none, this job is required}) accounts for it. Someone added an \`if:\` without teaching the gate about it. "
                fi
                ;;
              '')
                row "$check" "$result" "**NO RESULT**"
                RED="${RED}This gate has no result for \`$check\` — its \`needs:\` list and its manifest disagree. "
                ;;
              *)
                row "$check" "$result" "**NOT a pass**"
                # `cancelled` covers concurrency cancel-in-progress AND the job
                # timeout, and is deliberately red: a suite that was killed proved
                # nothing.
                RED="${RED}\`$check\` concluded \`$result\`. "
                BROKEN="$check"
                ;;
            esac
          done <<< "$JOBS"

          # (4) Positive proof, not merely the absence of failure — the e2e gate's
          #     anti-vacuity lock generalised to N jobs. `needs.<job>.result` reports
          #     what the runner thinks; it does not assert a job of that name ever
          #     existed. Ask the API, once.
          if ! gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
                 --jq '.jobs[] | [.name, (.conclusion // "pending")] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          then
            fail "Could not list this run's jobs, so this gate cannot prove the certified jobs actually ran. Refusing to certify on \`needs.*.result\` alone."
          fi

          while IFS= read -r check; do
            [ -n "$check" ] || continue
            # Last match wins, mirroring the e2e gate's `| last`: re-running a single
            # job appends a second entry under the same name.
            actual=$(awk -F'\t' -v n="$check" '$1 == n { c = $2 } END { print (c == "" ? "missing" : c) }' "$RUNNER_TEMP/jobs.tsv")
            if [ "$actual" != "success" ]; then
              RED="${RED}\`needs\` reported success for \`$check\`, but the job of that name in this run concluded \`$actual\`. Refusing to certify a lane whose job cannot be found. "
            fi
          done < "$CERTIFY"

          # (No advisory step to surface here: unlike ci-nfe.yml, this lane has no
          # `continue-on-error` steps, so every failure inside it is already fatal
          # and shows up through the normal result path above.)

          [ -z "$RED" ] || fail "$RED"

          if [ ! -s "$CERTIFY" ]; then
            pass "No run was required — $REASON See the \`$SCOPE_JOB\` job summary for the full path attribution."
          fi
          pass "Every required job for this lane concluded \`success\`. Scope: $REASON"
