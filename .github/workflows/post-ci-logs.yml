name: Post CI logs on failure

# Quando o workflow "CI" termina com falha num PR, esta workflow puxa o
# tail dos logs dos steps que falharam e posta como comentário no PR.
# Objetivo: dar contexto suficiente para o autor (humano ou agente) corrigir
# sem precisar abrir o GitHub e clicar pelo log gigantesco.
#
# Não exige PAT do colaborador — o GITHUB_TOKEN do runner já tem
# `actions: read` (logs) e `pull-requests: write` (comentar) via permissions.

on:
  workflow_run:
    workflows: ["CI", "E2E Smoke", "Configuracoes E2E", "Clientes e2e", "Categorias e2e"]
    types: [completed]

jobs:
  post-logs:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          PR=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR" ]; then
            echo "Nenhum PR associado ao run $RUN_ID (provavelmente PR de fork). Encerrando."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch failed logs
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          # --log-failed traz só os steps que falharam, separados por job.
          # tail -c 12000 mantém os últimos ~12KB (onde costuma estar o erro real).
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/full.log 2>&1 || true
          tail -c 12000 /tmp/full.log > /tmp/logs.txt
          if [ ! -s /tmp/logs.txt ]; then
            echo "(sem output capturado — verifique o run no GitHub)" > /tmp/logs.txt
          fi

      - name: Post comment on PR
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "<details>"
            echo "<summary>CI failed — \`$RUN_NAME\` em <code>${HEAD_SHA:0:7}</code> (<a href=\"$RUN_URL\">ver run</a>) — últimos 12KB dos steps que falharam</summary>"
            echo
            echo '```'
            cat /tmp/logs.txt
            echo '```'
            echo
            echo "</details>"
          } > /tmp/body.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/body.md
